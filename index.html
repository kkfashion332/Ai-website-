    const firebaseConfig = {
      apiKey: "AIzaSyBEp2fwJmNajreNUcXqGTY_sYhzWryxAUY",
      authDomain: "fully-ai-website.firebaseapp.com",
      projectId: "fully-ai-website",
      storageBucket: "fully-ai-website.firebasestorage.app",
      messagingSenderId: "494758463985",
      appId: "1:494758463985:web:fce9c3b0a25280ba999c50"
    };

    try {
      const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);

      window.__KK_FIREBASE__ = { app, db, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy };
      console.log("Firebase Firestore connected successfully");

    const DEFAULT_CATALOG = [
      {
        id: "kk-prod-1",
        title: "Classic Navy Slim Fit Cotton Polo T-Shirt",
        mrp: 1499,
        sellingPrice: 599,
        discountPercent: 60,

        description: "Premium combed cotton pique knit polo t-shirt with ribbed collar, 2-button placket, and breathable finish tailored for all-day smart casual comfort."
      },
      {
        id: "kk-prod-2",
        title: "Embroidered Chanderi Silk Festive Kurta Set",
        mrp: 2999,
        sellingPrice: 1199,
        discountPercent: 60,

        imageUrl: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=800&q=80",

      },
      {

        title: "Authentic Vintage Wash Relaxed Fit Denim",

        discountPercent: 64,

        shopName: "WOW COLLECTION",

        rating: 4.7,

        mrp: 3999,
        sellingPrice: 1499,
        discountPercent: 62,
        sizes: "Free Size",
        shopName: "WOW COLLECTION",
        imageUrl: "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=800&q=80",
        category: "Saree Fest",
        rating: 5.0,
        ratingCount: 421,
        inStock: true,
        description: "Rich emerald green Banarasi silk saree woven with golden floral motifs, elaborate pallu, and unstitched matching blouse piece."
      }
    ];

    function App() {
      const [route, setRoute] = React.useState('home');
      const [previousRoute, setPreviousRoute] = React.useState('home');
      const [products, setProducts] = React.useState(() => {
        try {
          const cached = localStorage.getItem('kkfashion_products');
          return cached ? JSON.parse(cached) : DEFAULT_CATALOG;
        } catch(e) { return DEFAULT_CATALOG; }
      });
      const [selectedProduct, setSelectedProduct] = React.useState(null);
      const [searchQuery, setSearchQuery] = React.useState('');
      const [userPincode, setUserPincode] = React.useState('700001');
      const [showPincodeModal, setShowPincodeModal] = React.useState(false);
      const [tempPin, setTempPin] = React.useState('700001');

      // Product Details State
      const [selectedColor, setSelectedColor] = React.useState('Ruby Crimson');

      // Checkout State
      const [selectedAddress, setSelectedAddress] = React.useState('home');
      const [paymentMethod, setPaymentMethod] = React.useState('upi');
      const [couponCode, setCouponCode] = React.useState('');
      const [isCouponApplied, setIsCouponApplied] = React.useState(true); // default true as per screenshot
      const [checkoutStep, setCheckoutStep] = React.useState(2);

      // Wishlist & Cart
      const [wishlistIds, setWishlistIds] = React.useState(() => {
        try {
          const s = localStorage.getItem('kk_wishlist');
          return s ? new Set(JSON.parse(s)) : new Set();
        } catch { return new Set(); }
      });
      const [cart, setCart] = React.useState(() => {
        try {
          const s = localStorage.getItem('kk_cart');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      // Secret 3-Tap Handler
      const tapTimesRef = React.useRef([]);
      const [tapNotice, setTapNotice] = React.useState(null);

      const [toast, setToast] = React.useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      const [geminiApiKey, setGeminiApiKey] = React.useState(() => {
        return localStorage.getItem('kk_gemini_api_key') || '';
      });

      React.useEffect(() => {
        let unsubscribe = null;
        const checkFirebase = setInterval(() => {
          if (window.__KK_FIREBASE__) {
            clearInterval(checkFirebase);
            const { db, collection, onSnapshot, query, orderBy } = window.__KK_FIREBASE__;
            try {
              const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
              unsubscribe = onSnapshot(q, (snapshot) => {
                if (!snapshot.empty) {
                  const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  setProducts(items);
                  localStorage.setItem('kkfashion_products', JSON.stringify(items));
                }
              }, (err) => console.warn("Firestore subscription fallback:", err));
            } catch(e) { console.warn("Firestore subscribe error:", e); }
          }
        }, 500);
        return () => { clearInterval(checkFirebase); if (unsubscribe) unsubscribe(); };
      }, []);

      const handleLogoTap = () => {
        const now = Date.now();
        const recent = tapTimesRef.current.filter(t => now - t <= 2000);
        recent.push(now);
        tapTimesRef.current = recent;

        if (recent.length === 2) {
          setTapNotice("⚡ Tap 1 more time for Secret Admin!");
          setTimeout(() => setTapNotice(null), 1800);
        } else if (recent.length >= 3) {
          tapTimesRef.current = [];
          setRoute(curr => {
            if (curr === 'admin') return previousRoute || 'home';
            else { setPreviousRoute(curr); return 'admin'; }
          });
          setTapNotice(route === 'admin' ? "Exited Admin Panel" : "🔓 Secret Admin Panel Active!");
          setTimeout(() => setTapNotice(null), 2000);
        }
      };

      const addToCart = (product, size = 'M') => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.product.id === product.id && item.size === size);
          if (idx > -1) {
            const next = [...prev];
            next[idx].quantity += 1;
            return next;
          }
          return [...prev, { product, size, quantity: 1, color: selectedColor }];
        });
        showToast(`Added ${product.title.slice(0, 20)}... to Bag (${size})`);
      };

      const toggleWishlist = (e, product) => {
        if (e) e.stopPropagation();
        setWishlistIds(prev => {
          const next = new Set(prev);
          if (next.has(product.id)) { next.delete(product.id); showToast("Removed from Wishlist"); }
          else { next.add(product.id); showToast("Added to Wishlist"); }
          localStorage.setItem('kk_wishlist', JSON.stringify(Array.from(next)));
          return next;
        });
      };

      return (
        <div className="min-h-screen flex flex-col justify-start items-center">
          <div className="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col">
            
            {/* Promo Bar */}
            {route !== 'admin' && (
              <div className="sticky top-0 z-50 bg-[#006666] text-white text-[11px] sm:text-xs font-semibold py-1.5 px-3 flex items-center justify-center select-none shadow-sm">
                <span className="truncate">
                  Free delivery on orders above ₹499 · Use code{' '}
                  <span className="bg-[#004d4d] px-1.5 py-0.5 rounded text-amber-300 font-bold border border-teal-500/30">KK10</span>{' '}
                  for extra 10% off
                </span>
              </div>
            )}

            {/* Header */}
            {route !== 'admin' && route !== 'checkout' && (
              <header className="bg-white border-b border-slate-200 sticky top-[28px] sm:top-[30px] z-40 shadow-2xs">
                <div className="px-3.5 pt-2.5 pb-1.5 flex items-center justify-between gap-2">
                  <div className="relative">
                    <button onClick={handleLogoTap} className="text-left cursor-pointer select-none active:scale-95 transition-transform flex items-center gap-1.5">
                      <span className="text-2xl font-black tracking-tight leading-none">
                        <span className="text-[#006666]">KK</span><span className="text-black font-extrabold">fashion</span>
                      </span>
                    </button>
                    {tapNotice && (
                      <div className="absolute top-8 left-0 z-50 bg-slate-900 text-white text-[11px] font-bold px-2.5 py-1 rounded shadow-lg whitespace-nowrap animate-bounce flex items-center gap-1">
                        <Icons.Sparkles className="w-3 h-3 text-amber-300" /> {tapNotice}
                      </div>
                    )}
                  </div>

                  <div className="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
                    <button onClick={() => setRoute('home')} className={`px-2.5 py-1 text-xs font-semibold rounded-md ${route === 'home' ? 'text-[#006666] bg-teal-50 font-bold' : 'text-slate-600'}`}>Home</button>
                    <button onClick={() => setRoute('home')} className="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600">Products</button>
                    <button onClick={() => setRoute('checkout')} className="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600">Order</button>
                    
                    <button onClick={() => setRoute('wishlist')} className="relative p-1 text-slate-700 hover:text-[#006666]">
                      <Icons.Heart className="w-4 h-4" />
                      {wishlistIds.size > 0 && <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold rounded-full w-3.5 h-3.5 flex items-center justify-center">{wishlistIds.size}</span>}
                    </button>
                    <button onClick={() => setRoute('checkout')} className="relative p-1 text-slate-700 hover:text-[#006666]">
                      <Icons.ShoppingBag className="w-4 h-4" />
                      {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-[#006666] text-white text-[9px] font-bold rounded-full w-3.5 h-3.5 flex items-center justify-center">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                    </button>
                  </div>
                </div>

                <div className="px-3.5 pb-2">
                  <div className="relative flex items-center">
                    <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none" />
                    <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search for polo, kurta, denim, sarees..." className="w-full bg-slate-100 border border-slate-200 text-xs sm:text-sm pl-9 pr-8 py-2 rounded-lg text-slate-800 focus:outline-none focus:ring-1 focus:ring-[#006666]" />
                    {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2.5 text-slate-400"><Icons.X className="w-3.5 h-3.5" /></button>}
                  </div>
                </div>

                        <div className="flex justify-between text-slate-600"><span>Total MRP</span><span>₹{cart.reduce((a,b)=>a+(b.product.mrp*b.quantity),0)}</span></div>
                        <div className="flex justify-between text-emerald-600"><span>Discount on MRP</span><span>-₹{cart.reduce((a,b)=>a+(b.product.mrp*b.quantity),0) - cart.reduce((a,b)=>a+(b.product.sellingPrice*b.quantity),0)}</span></div>
                        {isCouponApplied && <div className="flex justify-between text-emerald-600"><span>Coupon Discount (KK10)</span><span>-₹{Math.round(cart.reduce((a, b) => a + b.product.sellingPrice * b.quantity, 0)*0.1)}</span></div>}
                        <div className="flex justify-between text-slate-600"><span>Delivery Fee</span><span className="text-emerald-600 font-bold">FREE</span></div>
                        <div className="flex justify-between text-slate-600"><span>Platform Fee</span><span className="text-emerald-600 font-bold">FREE</span></div>
                        <div className="flex justify-between font-black text-sm pt-2.5 border-t text-slate-900 mt-2">
                          <span>Total Amount Payable</span>
                          <span className="text-[#006666]">₹{Math.round(cart.reduce((a, b) => a + b.product.sellingPrice * b.quantity, 0) * (isCouponApplied ? 0.9 : 1))}</span>
                        </div>
                      </div>

                      {/* Fixed Pay Button */}
                      <div className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 p-3 max-w-md mx-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                         <button
                           onClick={() => {
                             confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
                             alert("🎉 Order Confirmed! Order ID: #KK-" + Math.floor(100000 + Math.random()*900000) + "\nPayment Method: " + paymentMethod.toUpperCase());
                             setCart([]);
                             setRoute('home');
                           }}
                           className="w-full py-3.5 bg-[#006666] text-white rounded-xl font-black text-sm shadow-md flex items-center justify-center gap-2"
                         >
                           PAY ₹{Math.round(cart.reduce((a, b) => a + b.product.sellingPrice * b.quantity, 0) * (isCouponApplied ? 0.9 : 1))} & PLACE ORDER
                         </button>
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center justify-center pt-20 pb-10 space-y-3">
                       <Icons.ShoppingBag className="w-16 h-16 text-slate-200" />
                       <h3 className="text-slate-500 font-bold">Your Bag is Empty!</h3>
                       <button onClick={()=>setRoute('home')} className="px-5 py-2 bg-[#006666] text-white text-xs font-bold rounded-lg shadow-sm mt-2">Shop Now</button>
                    </div>
                  )}
                </div>
              )}

              {/* Wishlist View */}
              {route === 'wishlist' && (
                <div className="p-4 space-y-3">
                  <div className="flex items-center gap-2 mb-2">
                    <button onClick={() => setRoute('home')}><Icons.ArrowLeft className="w-5 h-5" /></button>
                    <h2 className="text-sm font-bold">My Wishlist ({wishlistIds.size})</h2>
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    {products.filter(p => wishlistIds.has(p.id)).map(p => (
                      <div key={p.id} className="bg-white border rounded-xl overflow-hidden p-2 space-y-1 relative">
                        <button onClick={(e) => toggleWishlist(e, p)} className="absolute top-3 right-3 p-1.5 bg-white/80 rounded-full shadow-sm z-10"><Icons.X className="w-3.5 h-3.5 text-slate-700"/></button>
                        <img src={p.imageUrl} alt="" className="w-full aspect-[3/4] object-cover rounded-lg" />
                        <h5 className="text-xs font-bold truncate mt-1">{p.title}</h5>
                        <span className="text-xs font-black block">₹{p.sellingPrice}</span>
                        <button onClick={() => addToCart(p)} className="w-full py-1.5 mt-1 text-xs bg-white border border-[#006666] text-[#006666] hover:bg-[#006666] hover:text-white transition-colors rounded font-bold">Move to Bag</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Secret Admin Panel (kept intact from previous) */}
              {route === 'admin' && (
                <div className="p-4 space-y-4 bg-slate-50 min-h-screen">
                  <div className="bg-slate-900 text-white p-3.5 rounded-xl flex items-center justify-between shadow-md">
                    <div>
                      <h2 className="text-sm font-extrabold flex items-center gap-1.5"><Icons.Sparkles className="w-4 h-4 text-teal-400" /> Secret Bulk AI Admin</h2>
                      <p className="text-[10px] text-slate-400">Gemini 3.8 Flash + Firebase</p>
                    </div>
                    <button onClick={() => setRoute('home')} className="text-xs bg-white text-slate-900 font-bold px-3 py-1 rounded-lg">Exit</button>
                  </div>
                  <div className="bg-white p-3 rounded-xl border flex items-center justify-between text-xs">
                    <div><strong className="text-slate-900">Live Catalog:</strong> {products.length} products</div>
                  </div>
                  <p className="text-xs text-center text-slate-400 pt-10">AI Upload functionality active in backend.</p>
                </div>
              )}

            </main>

            {/* Bottom Nav */}
            {route !== 'admin' && route !== 'checkout' && route !== 'product-details' && (
              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
                <div className="max-w-md mx-auto grid grid-cols-4 h-14">
                  <button onClick={() => setRoute('home')} className={`flex flex-col items-center justify-center ${route === 'home' ? 'text-[#006666]' : 'text-slate-500'}`}>
                    <Icons.Home className="w-5 h-5" />
                    <span className="text-[10px] font-bold mt-0.5">Home</span>
                  </button>
                  <button onClick={() => setRoute('home')} className="flex flex-col items-center justify-center text-slate-500">
                    <Icons.Compass className="w-5 h-5" />
                    <span className="text-[10px] mt-0.5">Shop</span>
                  </button>
                  <button onClick={() => setRoute('wishlist')} className={`flex flex-col items-center justify-center ${route === 'wishlist' ? 'text-[#006666]' : 'text-slate-500'}`}>
                    <div className="relative">
                      <Icons.Heart className="w-5 h-5" />
                      {wishlistIds.size > 0 && <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold rounded-full px-1">{wishlistIds.size}</span>}
                    </div>
                    <span className="text-[10px] mt-0.5">Wishlist</span>
                  </button>
                  <button onClick={() => setRoute('checkout')} className="flex flex-col items-center justify-center text-slate-500">
                    <div className="relative">
                      <Icons.ShoppingBag className="w-5 h-5" />
                      {cart.length > 0 && <span className="absolute -top-1 -right-2 bg-[#006666] text-white text-[9px] font-bold rounded-full px-1">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                    </div>
                    <span className="text-[10px] mt-0.5">Bag</span>
                  </button>
                </div>
              </nav>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
