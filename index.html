    function App() {
      const [route, setRoute] = React.useState('home');
      const [previousRoute, setPreviousRoute] = React.useState('home');
      const [products, setProducts] = React.useState(() => {
        try {
          const cached = localStorage.getItem('kkfashion_products');
          return cached ? JSON.parse(cached) : DEFAULT_CATALOG;
        } catch(e) {
          return DEFAULT_CATALOG;
        }
      });

      const [showPincodeModal, setShowPincodeModal] = React.useState(false);
      const [tempPin, setTempPin] = React.useState('700001');

      // Wishlist & Cart
      const [wishlistIds, setWishlistIds] = React.useState(() => {
        try {
          const s = localStorage.getItem('kk_wishlist');
          return s ? new Set(JSON.parse(s)) : new Set();
        } catch { return new Set(); }
      });
      const [cart, setCart] = React.useState(() => {
        try {
          const s = localStorage.getItem('kk_cart');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      // Secret 3-Tap Handler
      const tapTimesRef = React.useRef([]);
      const [tapNotice, setTapNotice] = React.useState(null);

      // Toast notification
      const [toast, setToast] = React.useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      // Gemini API Key (configurable for GitHub Pages)
      const [geminiApiKey, setGeminiApiKey] = React.useState(() => {
        return localStorage.getItem('kk_gemini_api_key') || '';
      });

      // Firebase Firestore Sync
      React.useEffect(() => {
        let unsubscribe = null;
        const checkFirebase = setInterval(() => {
          if (window.__KK_FIREBASE__) {
            clearInterval(checkFirebase);
            const { db, collection, onSnapshot, query, orderBy } = window.__KK_FIREBASE__;
            try {
              const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
              unsubscribe = onSnapshot(q, (snapshot) => {
                if (!snapshot.empty) {
                  const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  setProducts(items);
                  localStorage.setItem('kkfashion_products', JSON.stringify(items));
                }
              }, (err) => {
                console.warn("Firestore subscription fallback:", err);
              });
            } catch(e) {
              console.warn("Firestore subscribe error:", e);
            }
          }
        }, 500);

        return () => {
          clearInterval(checkFirebase);
          if (unsubscribe) unsubscribe();
        };
      }, []);

      // Secret 3-Tap on Logo
      const handleLogoTap = () => {
        const now = Date.now();
        const recent = tapTimesRef.current.filter(t => now - t <= 2000);
        recent.push(now);
        tapTimesRef.current = recent;

        if (recent.length === 2) {
          setTapNotice("⚡ Tap 1 more time for Secret Admin!");
          setTimeout(() => setTapNotice(null), 1800);
        } else if (recent.length >= 3) {
          tapTimesRef.current = [];
          setRoute(curr => {
            if (curr === 'admin') {
              return previousRoute || 'home';
            } else {
              setPreviousRoute(curr);
              return 'admin';
            }
          });
          setTapNotice(route === 'admin' ? "Exited Admin Panel" : "🔓 Secret Admin Panel Active!");
          setTimeout(() => setTapNotice(null), 2000);
        }
      };

      const addToCart = (product, size = 'M') => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.product.id === product.id && item.size === size);
          if (idx > -1) {
            const next = [...prev];
            next[idx].quantity += 1;
            return next;
          }
          return [...prev, { product, size, quantity: 1 }];
        });
        showToast(`Added ${product.title.slice(0, 20)}... to Bag (${size})`);
      };

      const toggleWishlist = (e, product) => {
        if (e) e.stopPropagation();
        setWishlistIds(prev => {
          const next = new Set(prev);
          if (next.has(product.id)) {
            next.delete(product.id);
            showToast("Removed from Wishlist");
          } else {
            next.add(product.id);
            showToast("Added to Wishlist");
          }
          localStorage.setItem('kk_wishlist', JSON.stringify(Array.from(next)));
          return next;
        });
      };

                  <div className="bg-white p-3 rounded-xl border flex items-center justify-between text-xs">
                    <div>
                      <strong className="text-slate-900">Firestore Catalog:</strong> {products.length} live products
                    </div>
                    <button
                      onClick={async () => {
                        if (window.__KK_FIREBASE__) {
                          const { db, collection, addDoc, serverTimestamp } = window.__KK_FIREBASE__;
                          for (const it of DEFAULT_CATALOG) {
                            await addDoc(collection(db, 'products'), { ...it, createdAt: serverTimestamp() });
                          }
                          showToast("Default catalog seeded to Firestore!");
                        }
                      }}
                      className="text-xs text-[#006666] font-bold underline"
                    >
                      Seed Default Collection
                    </button>
                  </div>
                </div>
              )}
            </main>

            {/* Bottom Nav */}
            {route !== 'admin' && route !== 'checkout' && (
              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t shadow-md">
                <div className="max-w-md mx-auto grid grid-cols-4 h-14">
                  <button onClick={() => setRoute('home')} className={`flex flex-col items-center justify-center ${route === 'home' ? 'text-[#006666]' : 'text-slate-500'}`}>
                    <Icons.Home className="w-5 h-5" />
                    <span className="text-[10px] font-bold">Home</span>
                  </button>
                  <button onClick={() => setRoute('home')} className="flex flex-col items-center justify-center text-slate-500">
                    <Icons.Compass className="w-5 h-5" />
                    <span className="text-[10px]">Shop</span>
                  </button>
                  <button onClick={() => setRoute('wishlist')} className={`flex flex-col items-center justify-center ${route === 'wishlist' ? 'text-[#006666]' : 'text-slate-500'}`}>
                    <div className="relative">
                      <Icons.Heart className="w-5 h-5" />
                      {wishlistIds.size > 0 && <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold rounded-full px-1">{wishlistIds.size}</span>}
                    </div>
                    <span className="text-[10px]">Wishlist</span>
                  </button>
                  <button onClick={() => setRoute('checkout')} className="flex flex-col items-center justify-center text-slate-500">
                    <div className="relative">
                      <Icons.ShoppingBag className="w-5 h-5" />
                      {cart.length > 0 && <span className="absolute -top-1 -right-2 bg-[#006666] text-white text-[9px] font-bold rounded-full px-1">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                    </div>
                    <span className="text-[10px]">Bag</span>
                  </button>
                </div>
              </nav>
            )}
          </div>
        </div>
      );

      async function processImageWithGemini(imageUrlOrBase64, filename) {
        showToast("Gemini AI analyzing: " + filename);
        let title = "Designer " + filename.replace(/\.[^/.]+$/, "");
        let mrp = 1499;
        let sellingPrice = 599;
        let sizes = "S, M, L, XL";
        let shopName = "WOW COLLECTION";

        if (geminiApiKey && imageUrlOrBase64.startsWith("data:image/")) {
          try {
            const rawBase64 = imageUrlOrBase64.split(",")[1];
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { inlineData: { mimeType: "image/jpeg", data: rawBase64 } },
                    { text: "Analyze this clothing product image. Return ONLY valid JSON: 'title' (SEO friendly), 'mrp' (realistic Indian integer price), 'sellingPrice' (discounted integer price), 'sizes' (e.g., 'S, M, L'), 'shopName' (default: 'WOW COLLECTION'). No markdown." }
                  ]
                }]
              })
            });
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              const clean = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
              const parsed = JSON.parse(clean);
              title = parsed.title || title;
              mrp = Number(parsed.mrp) || mrp;
              sellingPrice = Number(parsed.sellingPrice) || sellingPrice;
              sizes = parsed.sizes || sizes;
            }
          } catch(err) {
            console.warn("Direct Gemini call error, using smart fallback:", err);
          }
        }

        const newProduct = {
          id: "kk-ai-" + Date.now() + Math.random().toString(36).substr(2, 4),
          title,
          mrp,
          sellingPrice,
          discountPercent: Math.round(((mrp - sellingPrice) / mrp) * 100),
          sizes,
          shopName,
          imageUrl: imageUrlOrBase64,
          category: "Trending",
          rating: 5.0,
          ratingCount: 1,
          inStock: true,
          description: "Exclusive designer fashion apparel crafted with premium breathable weave for modern elegance."
        };

        if (window.__KK_FIREBASE__) {
          try {
            const { db, collection, addDoc, serverTimestamp } = window.__KK_FIREBASE__;
            await addDoc(collection(db, 'products'), {
              ...newProduct,
              createdAt: serverTimestamp()
            });
            showToast("Saved to Firebase Firestore: " + title.slice(0, 20));
          } catch(e) {
            console.warn("Firestore addDoc error:", e);
          }
        }

        setProducts(prev => [newProduct, ...prev]);
      }
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
