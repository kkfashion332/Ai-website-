<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KKfashion - Indian Fashion E-Commerce PWA</title>
  <meta name="theme-color" content="#006666" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { teal: '#006666', tealDark: '#004d4d', tealLight: '#e6f0f0' } },
          fontFamily: { sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Firebase 10 Modular SDK via ES Modules -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEp2fwJmNajreNUcXqGTY_sYhzWryxAUY",
      authDomain: "fully-ai-website.firebaseapp.com",
      projectId: "fully-ai-website",
      storageBucket: "fully-ai-website.firebasestorage.app",
      messagingSenderId: "494758463985",
      appId: "1:494758463985:web:fce9c3b0a25280ba999c50"
    };

    try {
      const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.__KK_FIREBASE__ = { app, db, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy };
    } catch(err) { console.warn("Firebase init error:", err); }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .custom-radio { accent-color: #006666; width: 16px; height: 16px; }
  </style>
</head>
<body class="bg-slate-200/70 text-slate-900 antialiased selection:bg-[#006666] selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const Icons = {
      Heart: ({ className = "w-4 h-4", fill = "none" }) => (<svg className={className} fill={fill} stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>),
      ShoppingBag: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>),
      Home: ({ className = "w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>),
      Compass: ({ className = "w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>),
      Search: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>),
      MapPin: ({ className = "w-3 h-3" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>),
      Store: ({ className = "w-3 h-3" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>),
      Sparkles: ({ className = "w-3.5 h-3.5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>),
      Check: ({ className = "w-3 h-3" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>),
      ArrowLeft: ({ className = "w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>),
      ShieldCheck: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>),
      Zap: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>),
      X: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>),
      Tag: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>),
      Plus: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>),
      Trash: ({ className = "w-4 h-4" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>)
    };

    const DEFAULT_CATALOG = [
      {
        id: "kk-prod-2",
        title: "Embroidered Chanderi Silk Festive Kurta Set",
        mrp: 2999,
        sellingPrice: 1199,
        sizes: "M, L, XL, XXL",
        shopName: "WOW COLLECTION",
        category: "Festive Wear",
        rating: 4.9,
        ratingCount: 512,
        description: "Graceful Chanderi silk kurta highlighted with intricate zari thread work, paired with matching tapered trousers.",
        variants: [
          { colorName: 'Ruby Crimson', colorCode: '#a31525', imageUrls: ['https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=800&q=80'] },
          { colorName: 'Emerald Green', colorCode: '#046e53', imageUrls: ['https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=800&q=80'] },
          { colorName: 'Mustard Gold', colorCode: '#c58b16', imageUrls: ['https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=80'] }
        ]
      },
      {
        id: "kk-prod-1",
        title: "Classic Navy Slim Fit Cotton Polo T-Shirt",
        mrp: 1499,
        sellingPrice: 599,
        sizes: "S, M, L, XL",
        shopName: "WOW COLLECTION",
        category: "Polo T-Shirts",
        rating: 4.8,
        ratingCount: 342,
        description: "Premium combed cotton pique knit polo t-shirt with ribbed collar.",
        variants: [
          { colorName: 'Navy Blue', colorCode: '#1a2b4c', imageUrls: ['https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=800&q=80'] }
        ]
      }
    ];

    function App() {
      const [route, setRoute] = React.useState('home');
      const [previousRoute, setPreviousRoute] = React.useState('home');
      const [products, setProducts] = React.useState(() => {
        try { const cached = localStorage.getItem('kkfashion_products'); return cached ? JSON.parse(cached) : DEFAULT_CATALOG; } 
        catch(e) { return DEFAULT_CATALOG; }
      });
      const [selectedProduct, setSelectedProduct] = React.useState(null);
      const [searchQuery, setSearchQuery] = React.useState('');
      const [userPincode, setUserPincode] = React.useState('700001');

      // Product Details State
      const [selectedColor, setSelectedColor] = React.useState('');
      const [activeImage, setActiveImage] = React.useState('');

      // Checkout State
      const [selectedAddress, setSelectedAddress] = React.useState('home');
      const [paymentMethod, setPaymentMethod] = React.useState('upi');
      const [isCouponApplied, setIsCouponApplied] = React.useState(true);

      // Wishlist & Cart
      const [wishlistIds, setWishlistIds] = React.useState(() => {
        try { const s = localStorage.getItem('kk_wishlist'); return s ? new Set(JSON.parse(s)) : new Set(); } 
        catch { return new Set(); }
      });
      const [cart, setCart] = React.useState(() => {
        try { const s = localStorage.getItem('kk_cart'); return s ? JSON.parse(s) : []; } 
        catch { return []; }
      });

      // Admin Form State
      const [adminForm, setAdminForm] = React.useState({ title: '', mrp: '', sellingPrice: '', sizes: 'S, M, L, XL', category: 'Festive Wear', shopName: 'WOW COLLECTION', description: '' });
      const [adminVariants, setAdminVariants] = React.useState([{ colorName: '', colorCode: '#000000', imageUrls: '' }]);

      const tapTimesRef = React.useRef([]);
      const [tapNotice, setTapNotice] = React.useState(null);
      const [toast, setToast] = React.useState(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };

      React.useEffect(() => {
        let unsubscribe = null;
        const checkFirebase = setInterval(() => {
          if (window.__KK_FIREBASE__) {
            clearInterval(checkFirebase);
            const { db, collection, onSnapshot, query, orderBy } = window.__KK_FIREBASE__;
            try {
              const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
              unsubscribe = onSnapshot(q, (snapshot) => {
                if (!snapshot.empty) {
                  const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  setProducts(items);
                  localStorage.setItem('kkfashion_products', JSON.stringify(items));
                }
              }, (err) => console.warn("Firestore subscription fallback:", err));
            } catch(e) {}
          }
        }, 500);
        return () => { clearInterval(checkFirebase); if (unsubscribe) unsubscribe(); };
      }, []);

      // When product is selected, initialize its colors & image
      React.useEffect(() => {
        if(selectedProduct && selectedProduct.variants && selectedProduct.variants.length > 0) {
          setSelectedColor(selectedProduct.variants[0].colorName);
          setActiveImage(selectedProduct.variants[0].imageUrls[0]);
        } else if (selectedProduct) {
          setActiveImage(selectedProduct.imageUrl || '');
        }
      }, [selectedProduct]);

      const handleLogoTap = () => {
        const now = Date.now();
        const recent = tapTimesRef.current.filter(t => now - t <= 2000);
        recent.push(now);
        tapTimesRef.current = recent;

        if (recent.length === 2) {
          setTapNotice("⚡ Tap 1 more time for Secret Admin!");
          setTimeout(() => setTapNotice(null), 1800);
        } else if (recent.length >= 3) {
          tapTimesRef.current = [];
          setRoute(curr => {
            if (curr === 'admin') return previousRoute || 'home';
            else { setPreviousRoute(curr); return 'admin'; }
          });
          setTapNotice(route === 'admin' ? "Exited Admin Panel" : "🔓 Secret Admin Panel Active!");
          setTimeout(() => setTapNotice(null), 2000);
        }
      };

      const addToCart = (product, size = 'M') => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.product.id === product.id && item.size === size && item.color === selectedColor);
          if (idx > -1) {
            const next = [...prev];
            next[idx].quantity += 1;
            return next;
          }
          return [...prev, { product, size, quantity: 1, color: selectedColor }];
        });
        showToast(`Added ${product.title.slice(0, 20)}... to Bag`);
      };

      const toggleWishlist = (e, product) => {
        if (e) e.stopPropagation();
        setWishlistIds(prev => {
          const next = new Set(prev);
          if (next.has(product.id)) { next.delete(product.id); showToast("Removed from Wishlist"); }
          else { next.add(product.id); showToast("Added to Wishlist"); }
          localStorage.setItem('kk_wishlist', JSON.stringify(Array.from(next)));
          return next;
        });
      };

      // Handle Admin Variant Changes
      const updateVariant = (index, field, value) => {
        const newVariants = [...adminVariants];
        newVariants[index][field] = value;
        setAdminVariants(newVariants);
      };
      
      const addVariant = () => setAdminVariants([...adminVariants, { colorName: '', colorCode: '#000000', imageUrls: '' }]);
      const removeVariant = (index) => setAdminVariants(adminVariants.filter((_, i) => i !== index));

      const handleAdminSubmit = async (e) => {
        e.preventDefault();
        if(!window.__KK_FIREBASE__) { alert("Firebase not connected!"); return; }

        const formattedVariants = adminVariants.map(v => ({
          colorName: v.colorName,
          colorCode: v.colorCode,
          imageUrls: v.imageUrls.split(',').map(url => url.trim()).filter(Boolean)
        }));

        const newProduct = {
          title: adminForm.title,
          mrp: Number(adminForm.mrp),
          sellingPrice: Number(adminForm.sellingPrice),
          sizes: adminForm.sizes,
          category: adminForm.category,
          shopName: adminForm.shopName,
          description: adminForm.description,
          variants: formattedVariants,
          rating: 5.0,
          ratingCount: 1,
          createdAt: window.__KK_FIREBASE__.serverTimestamp()
        };

        try {
          const { db, collection, addDoc } = window.__KK_FIREBASE__;
          await addDoc(collection(db, 'products'), newProduct);
          showToast("Product added successfully!");
          // Reset form
          setAdminForm({ title: '', mrp: '', sellingPrice: '', sizes: 'S, M, L, XL', category: 'Festive Wear', shopName: 'WOW COLLECTION', description: '' });
          setAdminVariants([{ colorName: '', colorCode: '#000000', imageUrls: '' }]);
        } catch (error) {
          console.error("Error adding product: ", error);
          alert("Failed to add product.");
        }
      };

      // Helpers to get image for Product Card
      const getProductImage = (prod) => {
        if(prod.variants && prod.variants.length > 0 && prod.variants[0].imageUrls.length > 0) {
          return prod.variants[0].imageUrls[0];
        }
        return prod.imageUrl || 'https://via.placeholder.com/400';
      };

      return (
        <div className="min-h-screen flex flex-col justify-start items-center">
          <div className="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col">
            
            {/* Promo Bar */}
            {route !== 'admin' && (
              <div className="sticky top-0 z-50 bg-[#006666] text-white text-[11px] sm:text-xs font-semibold py-1.5 px-3 flex items-center justify-center select-none shadow-sm">
                <span className="truncate">
                  Free delivery on orders above ₹499 · Use code{' '}
                  <span className="bg-[#004d4d] px-1.5 py-0.5 rounded text-amber-300 font-bold border border-teal-500/30">KK10</span>{' '}
                  for extra 10% off
                </span>
              </div>
            )}

            {/* Header */}
            {route !== 'admin' && route !== 'checkout' && (
              <header className="bg-white border-b border-slate-200 sticky top-[28px] sm:top-[30px] z-40 shadow-2xs">
                <div className="px-3.5 pt-2.5 pb-1.5 flex items-center justify-between gap-2">
                  <div className="relative">
                    <button onClick={handleLogoTap} className="text-left cursor-pointer select-none active:scale-95 transition-transform flex items-center gap-1.5">
                      <span className="text-2xl font-black tracking-tight leading-none">
                        <span className="text-[#006666]">KK</span><span className="text-black font-extrabold">fashion</span>
                      </span>
                    </button>
                    {tapNotice && (
                      <div className="absolute top-8 left-0 z-50 bg-slate-900 text-white text-[11px] font-bold px-2.5 py-1 rounded shadow-lg whitespace-nowrap animate-bounce flex items-center gap-1">
                        <Icons.Sparkles className="w-3 h-3 text-amber-300" /> {tapNotice}
                      </div>
                    )}
                  </div>

                  <div className="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
                    <button onClick={() => setRoute('home')} className={`px-2.5 py-1 text-xs font-semibold rounded-md ${route === 'home' ? 'text-[#006666] bg-teal-50 font-bold' : 'text-slate-600'}`}>Home</button>
                    <button onClick={() => setRoute('home')} className="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600">Products</button>
                    <button onClick={() => setRoute('checkout')} className="px-2.5 py-1 text-xs font-semibold rounded-md text-slate-600">Order</button>
                    
                    <button onClick={() => setRoute('wishlist')} className="relative p-1 text-slate-700 hover:text-[#006666]">
                      <Icons.Heart className="w-4 h-4" />
                      {wishlistIds.size > 0 && <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold rounded-full w-3.5 h-3.5 flex items-center justify-center">{wishlistIds.size}</span>}
                    </button>
                    <button onClick={() => setRoute('checkout')} className="relative p-1 text-slate-700 hover:text-[#006666]">
                      <Icons.ShoppingBag className="w-4 h-4" />
                      {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-[#006666] text-white text-[9px] font-bold rounded-full w-3.5 h-3.5 flex items-center justify-center">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}
                    </button>
                  </div>
                </div>

                <div className="px-3.5 pb-2">
                  <div className="relative flex items-center">
                    <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none" />
                    <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search for polo, kurta, denim, sarees..." className="w-full bg-slate-100 border border-slate-200 text-xs sm:text-sm pl-9 pr-8 py-2 rounded-lg text-slate-800 focus:outline-none focus:ring-1 focus:ring-[#006666]" />
                    {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2.5 text-slate-400"><Icons.X className="w-3.5 h-3.5" /></button>}
                  </div>
                </div>
              </header>
            )}

            {toast && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg">{toast}</div>}

            <main className="flex-1 pb-20">
              {/* --- HOME PAGE --- */}
              {route === 'home' && (
                <div>
                  {/* Products Grid */}
                  <div className="px-3.5 pt-3 pb-6">
                    <h3 className="text-base font-black text-slate-900 mb-2 flex items-center gap-1">Trending Now <Icons.Sparkles className="w-4 h-4 text-amber-500"/></h3>
                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      {products.filter(p => !searchQuery || p.title.toLowerCase().includes(searchQuery.toLowerCase())).map((product) => {
                          const isWish = wishlistIds.has(product.id);
                          const discount = Math.round(((product.mrp - product.sellingPrice) / product.mrp) * 100);
                          const cardImage = getProductImage(product);
                          return (
                            <div key={product.id} onClick={() => { setSelectedProduct(product); setRoute('product-details'); }} className="group bg-white rounded-xl shadow-xs border border-slate-100 overflow-hidden flex flex-col cursor-pointer active:scale-[0.985]">
                              <div className="relative aspect-[3/4] bg-slate-100 overflow-hidden">
                                <img src={cardImage} alt={product.title} className="w-full h-full object-cover" />
                                <div className="absolute top-2 left-2 z-10"><span className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[9.5px] font-bold px-2 py-0.5 rounded-full shadow-xs uppercase">IN STOCK</span></div>
                                <button type="button" onClick={(e) => toggleWishlist(e, product)} className={`absolute top-2 right-2 z-10 p-1.5 rounded-full backdrop-blur-md ${isWish ? 'bg-rose-50 text-rose-500' : 'bg-white/80 text-slate-700 hover:text-rose-500'}`}>
                                  <Icons.Heart className={`w-4 h-4 ${isWish ? 'fill-rose-500' : ''}`} />
                                </button>
                                {product.variants && product.variants.length > 1 && (
                                  <div className="absolute bottom-2 right-2 z-10 bg-white/90 px-1.5 py-0.5 rounded text-[9px] font-bold text-slate-600 shadow-sm border">
                                    +{product.variants.length} Colors
                                  </div>
                                )}
                              </div>
                              <div className="p-2.5 flex flex-col flex-1 justify-between gap-1">
                                <h4 className="text-xs font-medium text-slate-800 truncate">{product.title}</h4>
                                <div className="flex items-baseline gap-1.5 flex-wrap">
                                  <span className="text-sm font-extrabold text-slate-900">₹{product.sellingPrice}</span>
                                  <span className="text-[11px] text-slate-400 line-through">₹{product.mrp}</span>
                                  <span className="text-[11px] font-bold text-emerald-600">-{discount}%</span>
                                </div>
                              </div>
                            </div>
                          );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* --- PRODUCT DETAILS PAGE --- */}
              {route === 'product-details' && selectedProduct && (
                <div className="bg-white min-h-screen pb-20">
                  <div className="sticky top-[28px] sm:top-[30px] z-30 bg-white/90 backdrop-blur border-b px-3.5 py-2.5 flex items-center justify-between">
                    <button onClick={() => setRoute('home')} className="p-1 rounded-full bg-white shadow-sm border border-slate-200"><Icons.ArrowLeft className="w-5 h-5" /></button>
                    <div className="flex items-center gap-2">
                       <button onClick={(e) => toggleWishlist(e, selectedProduct)} className="p-1.5 rounded-full bg-white shadow-sm border border-slate-200"><Icons.Heart className={`w-4 h-4 ${wishlistIds.has(selectedProduct.id) ? 'fill-rose-500 text-rose-500' : ''}`} /></button>
                       <button onClick={() => setRoute('checkout')} className="p-1.5 rounded-full bg-white shadow-sm border border-slate-200 relative"><Icons.ShoppingBag className="w-4 h-4" />{cart.length > 0 && <span className="absolute -top-1 -right-1 bg-[#006666] text-white text-[9px] font-bold rounded-full w-3.5 h-3.5 flex items-center justify-center">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}</button>
                    </div>
                  </div>

                  {/* Main Image Banner */}
                  <div className="aspect-[4/5] bg-slate-100 relative">
                    <img src={activeImage} alt={selectedProduct.title} className="w-full h-full object-cover transition-opacity duration-300" />
                  </div>

                  <div className="p-4 space-y-4">
                    <div>
                      <span className="text-[10px] font-bold text-[#006666] uppercase flex items-center gap-1">
                        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg> 
                        {selectedProduct.shopName || "WOW COLLECTION"} · {selectedProduct.category}
                      </span>
                      <h2 className="text-lg leading-tight font-bold text-slate-900 mt-1">{selectedProduct.title}</h2>
                      <div className="flex items-baseline gap-2 mt-1.5">
                        <span className="text-2xl font-black text-slate-900">₹{selectedProduct.sellingPrice}</span>
                        <span className="text-sm text-slate-400 line-through">₹{selectedProduct.mrp}</span>
                        <span className="text-sm font-bold text-emerald-600">({Math.round(((selectedProduct.mrp - selectedProduct.sellingPrice)/selectedProduct.mrp)*100)}% OFF)</span>
                      </div>
                    </div>

                    {/* DYNAMIC COLOR SELECTION SECTION */}
                    {selectedProduct.variants && selectedProduct.variants.length > 0 && (
                      <div className="border-t border-slate-100 pt-3">
                        <div className="flex justify-between items-center mb-2.5">
                          <span className="text-xs font-bold text-slate-900 uppercase flex items-center gap-1.5">
                            <svg className="w-4 h-4 text-[#006666]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"/></svg>
                            SELECT COLOR: <span className="text-[#006666] capitalize">{selectedColor}</span>
                          </span>
                          <span className="text-[10px] font-medium text-slate-500">{selectedProduct.variants.length} Colors Available</span>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                          {selectedProduct.variants.map((variant, index) => (
                            <button
                              key={index}
                              onClick={() => {
                                setSelectedColor(variant.colorName);
                                if(variant.imageUrls && variant.imageUrls.length > 0) {
                                  setActiveImage(variant.imageUrls[0]);
                                }
                              }}
                              className={`flex items-center gap-1.5 px-3 py-2 rounded-full border text-xs font-semibold transition-all ${selectedColor === variant.colorName ? 'border-[#006666] bg-teal-50 text-[#006666] shadow-sm' : 'border-slate-200 text-slate-700 bg-white hover:bg-slate-50'}`}
                            >
                              <span className="w-3.5 h-3.5 rounded-full border border-black/10" style={{ backgroundColor: variant.colorCode }}></span>
                              {variant.colorName}
                              {selectedColor === variant.colorName && <Icons.Check className="w-3.5 h-3.5 text-[#006666]" />}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* COUPON BANNER */}
                    <div className="p-3 bg-white border rounded-xl shadow-xs flex items-center justify-between mt-2">
                      <div className="flex items-start gap-2">
                        <Icons.Tag className="w-5 h-5 text-[#006666] mt-0.5" />
                        <div>
                          <p className="text-xs font-bold text-slate-800">Save extra 10% with coupon KK10</p>
                          <p className="text-[10px] text-slate-500">Applicable on your order right now</p>
                        </div>
                      </div>
                      <button className="text-[11px] font-bold text-[#006666] border border-[#006666] px-3 py-1.5 rounded-lg bg-white">Apply</button>
                    </div>

                    {/* SIZE SELECTION */}
                    <div className="border-t border-slate-100 pt-3">
                      <div className="flex justify-between items-center mb-2.5">
                        <span className="text-xs font-bold text-slate-900 uppercase">SELECT SIZE</span>
                      </div>
                      <div className="flex gap-2.5">
                        {(selectedProduct.sizes || "S, M, L, XL").split(',').map((s, i) => (
                          <button key={i} className={`w-12 h-12 rounded-full border font-bold text-xs flex items-center justify-center transition-all ${i===0 ? 'border-[#006666] bg-[#006666] text-white' : 'border-slate-300 text-slate-700 bg-white'}`}>
                            {s.trim()}
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    <p className="text-xs text-slate-500 leading-relaxed border-t pt-3 mt-3">{selectedProduct.description}</p>

                    {/* FIXED BOTTOM BAR */}
                    <div className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 p-3 flex gap-2.5 max-w-md mx-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                      <button onClick={() => addToCart(selectedProduct, selectedProduct.sizes.split(',')[0].trim())} className="flex-1 py-3.5 border-2 border-[#006666] text-[#006666] rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 bg-white">
                        <Icons.ShoppingBag className="w-4 h-4" /> ADD TO BAG
                      </button>
                      <button onClick={() => { addToCart(selectedProduct, selectedProduct.sizes.split(',')[0].trim()); setRoute('checkout'); }} className="flex-1 py-3.5 bg-[#006666] text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-md">
                        <Icons.Zap className="w-4 h-4" /> BUY NOW
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- CHECKOUT PAGE (Simplified for brevity in this snippet) --- */}
              {route === 'checkout' && (
                <div className="bg-slate-50 min-h-screen pb-24 p-4">
                  <div className="flex items-center gap-2 mb-4">
                     <button onClick={() => setRoute('home')} className="p-1 -ml-1"><Icons.ArrowLeft className="w-5 h-5 text-slate-700" /></button>
                     <h2 className="text-sm font-bold text-slate-900">Checkout</h2>
                  </div>
                  {cart.length > 0 ? (
                    <div className="space-y-4">
                      {cart.map((it, i) => (
                        <div key={i} className="flex gap-3 items-start bg-white p-3 rounded-xl border shadow-sm">
                          <img src={getProductImage(it.product)} alt="" className="w-16 h-20 object-cover rounded-md border" />
                          <div className="flex-1">
                            <h5 className="text-xs font-bold text-slate-900">{it.product.title}</h5>
                            <p className="text-[10px] text-slate-500">Size: {it.size} | Color: {it.color || 'Default'}</p>
                            <div className="text-sm font-black mt-1">₹{it.product.sellingPrice} x {it.quantity}</div>
                          </div>
                        </div>
                      ))}
                      <div className="bg-white rounded-xl border p-3.5 shadow-sm text-xs space-y-2">
                        <div className="flex justify-between font-black text-sm pt-2 text-slate-900">
                          <span>Total Payable</span>
                          <span className="text-[#006666]">₹{cart.reduce((a, b) => a + b.product.sellingPrice * b.quantity, 0)}</span>
                        </div>
                      </div>
                      <button onClick={() => { confetti(); alert("Order Placed!"); setCart([]); setRoute('home'); }} className="w-full py-3.5 bg-[#006666] text-white rounded-xl font-black text-sm shadow-md">
                        PLACE ORDER
                      </button>
                    </div>
                  ) : (<p className="text-center text-slate-500 font-bold mt-10">Your Bag is Empty</p>)}
                </div>
              )}

              {/* --- SECRET ADMIN PANEL (FULLY FUNCTIONAL MULTIPLE COLORS) --- */}
              {route === 'admin' && (
                <div className="p-4 space-y-4 bg-slate-50 min-h-screen pb-24">
                  <div className="bg-slate-900 text-white p-3.5 rounded-xl flex items-center justify-between shadow-md">
                    <div>
                      <h2 className="text-sm font-extrabold flex items-center gap-1.5"><Icons.Sparkles className="w-4 h-4 text-teal-400" /> Admin Dashboard</h2>
                      <p className="text-[10px] text-slate-400">Add Products with Variants</p>
                    </div>
                    <button onClick={() => setRoute('home')} className="text-xs bg-white text-slate-900 font-bold px-3 py-1 rounded-lg">Exit</button>
                  </div>

                  <form onSubmit={handleAdminSubmit} className="bg-white p-4 rounded-xl border shadow-sm space-y-3">
                    <h3 className="font-bold text-sm text-[#006666] border-b pb-2">Add New Product</h3>
                    
                    <input required type="text" placeholder="Product Title" value={adminForm.title} onChange={e => setAdminForm({...adminForm, title: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-xs" />
                    
                    <div className="flex gap-2">
                      <input required type="number" placeholder="MRP (e.g. 2999)" value={adminForm.mrp} onChange={e => setAdminForm({...adminForm, mrp: e.target.value})} className="w-1/2 border rounded-lg px-3 py-2 text-xs" />
                      <input required type="number" placeholder="Selling Price (e.g. 1199)" value={adminForm.sellingPrice} onChange={e => setAdminForm({...adminForm, sellingPrice: e.target.value})} className="w-1/2 border rounded-lg px-3 py-2 text-xs font-bold text-[#006666]" />
                    </div>

                    <div className="flex gap-2">
                      <input required type="text" placeholder="Category" value={adminForm.category} onChange={e => setAdminForm({...adminForm, category: e.target.value})} className="w-1/2 border rounded-lg px-3 py-2 text-xs" />
                      <input required type="text" placeholder="Sizes (S, M, L...)" value={adminForm.sizes} onChange={e => setAdminForm({...adminForm, sizes: e.target.value})} className="w-1/2 border rounded-lg px-3 py-2 text-xs" />
                    </div>
                    
                    <textarea required placeholder="Product Description..." value={adminForm.description} onChange={e => setAdminForm({...adminForm, description: e.target.value})} className="w-full border rounded-lg px-3 py-2 text-xs h-16"></textarea>

                    {/* Color Variants Section */}
                    <div className="border-t border-dashed pt-3 mt-3">
                      <div className="flex justify-between items-center mb-2">
                        <h4 className="text-xs font-bold text-slate-800">Color Variants & Images</h4>
                        <button type="button" onClick={addVariant} className="text-[10px] bg-teal-50 text-[#006666] px-2 py-1 rounded font-bold flex items-center gap-1 border border-teal-200">
                          <Icons.Plus className="w-3 h-3"/> Add Color
                        </button>
                      </div>

                      <div className="space-y-3">
                        {adminVariants.map((variant, index) => (
                          <div key={index} className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2 relative">
                            {adminVariants.length > 1 && (
                              <button type="button" onClick={() => removeVariant(index)} className="absolute top-2 right-2 text-rose-500 p-1"><Icons.Trash className="w-4 h-4"/></button>
                            )}
                            
                            <div className="flex gap-2 pr-6">
                              <input required type="text" placeholder="Color Name (e.g. Ruby Crimson)" value={variant.colorName} onChange={e => updateVariant(index, 'colorName', e.target.value)} className="flex-1 border rounded px-2 py-1.5 text-xs" />
                              <div className="flex items-center gap-1 bg-white border rounded px-1">
                                <input type="color" value={variant.colorCode} onChange={e => updateVariant(index, 'colorCode', e.target.value)} className="w-6 h-6 p-0 border-0 rounded cursor-pointer" />
                              </div>
                            </div>
                            
                            <textarea required placeholder="Image URLs (Separate multiple with comma ,)" value={variant.imageUrls} onChange={e => updateVariant(index, 'imageUrls', e.target.value)} className="w-full border rounded px-2 py-1.5 text-xs h-12"></textarea>
                          </div>
                        ))}
                      </div>
                    </div>

                    <button type="submit" className="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl mt-4 shadow-md">
                      SAVE PRODUCT TO FIRESTORE
                    </button>
                  </form>
                </div>
              )}

            </main>

            {/* Bottom Nav */}
            {route !== 'admin' && route !== 'checkout' && route !== 'product-details' && (
              <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
                <div className="max-w-md mx-auto grid grid-cols-4 h-14">
                  <button onClick={() => setRoute('home')} className={`flex flex-col items-center justify-center ${route === 'home' ? 'text-[#006666]' : 'text-slate-500'}`}><Icons.Home className="w-5 h-5" /><span className="text-[10px] font-bold mt-0.5">Home</span></button>
                  <button onClick={() => setRoute('home')} className="flex flex-col items-center justify-center text-slate-500"><Icons.Compass className="w-5 h-5" /><span className="text-[10px] mt-0.5">Shop</span></button>
                  <button onClick={() => setRoute('wishlist')} className={`flex flex-col items-center justify-center ${route === 'wishlist' ? 'text-[#006666]' : 'text-slate-500'}`}>
                    <div className="relative"><Icons.Heart className="w-5 h-5" />{wishlistIds.size > 0 && <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[9px] font-bold rounded-full px-1">{wishlistIds.size}</span>}</div><span className="text-[10px] mt-0.5">Wishlist</span>
                  </button>
                  <button onClick={() => setRoute('checkout')} className="flex flex-col items-center justify-center text-slate-500">
                    <div className="relative"><Icons.ShoppingBag className="w-5 h-5" />{cart.length > 0 && <span className="absolute -top-1 -right-2 bg-[#006666] text-white text-[9px] font-bold rounded-full px-1">{cart.reduce((a, b) => a + b.quantity, 0)}</span>}</div><span className="text-[10px] mt-0.5">Bag</span>
                  </button>
                </div>
              </nav>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
