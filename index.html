<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ye meta tag mobile screen par scale aur rotation ko handle karta hai -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Splash Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background bilkul black rahega */
            background-color: #000000; 
            
            /* Flexbox se logo hamesha screen ke center mein rahega, chahe mobile rotate karo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Screen ke bahar ka hissa hide karne ke liye */
        }

        .splash-logo {
            width: auto;
            max-width: 85%; /* Mobile par zyada bada na ho isliye max-width set ki hai */
            max-height: 85vh;
            
            /* Garena wala animation: 2 second tak chalega aur wahi ruk jayega (forwards) */
            animation: zoomInReveal 2s ease-out forwards;
        }

        /* Zoom-In aur Fade-in ka main Keyframes Animation */
        @keyframes zoomInReveal {
            0% {
                transform: scale(0.4); /* Shuru mein chota rahega (andar ki taraf) */
                opacity: 0;            /* Shuru mein gayab rahega */
            }
            50% {
                opacity: 1;            /* Aadhi animation mein pura clear ho jayega */
            }
            100% {
                transform: scale(1);   /* Apne original size par aakar ruk jayega */
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Yahan aapki XEFRA image ko call kiya hai -->
    <img src="411207.jpg" alt="Game Logo" class="splash-logo">

</body>
</html>
