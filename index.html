                                  <img src={p.logo} alt={p.name} className="w-full h-full object-contain" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                                ) : (
                                  <span className="font-extrabold text-[#FFC928] text-sm">{p.name[0]}</span>
                                )}
                              </div>
                              <span className="font-bold text-xs text-white truncate w-full">{p.name}</span>
                              <span className="text-[10px] font-extrabold text-[#FFC928] truncate w-full mt-0.5">{p.commissionInfo}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* ALL PRODUCTS & DEALS */}
                    <div className="space-y-3 pt-1">
                      <div className="flex items-center justify-between">
                        <h3 className="font-display font-bold text-base text-white flex items-center gap-1.5">
                          <Icons.ShoppingBag />
                          <span>All Products &amp; Deals</span>
                        </h3>
                        <span className="text-[10px] text-zinc-400 bg-white/[0.05] px-2 py-0.5 rounded-full">{offers.length} Products</span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {offers.map(o => (
                          <div key={o.id} onClick={() => setSelectedOffer(o)} className="rounded-2xl bg-[#15171D] border border-white/[0.08] hover:border-[#FFC928]/40 overflow-hidden cursor-pointer transition-all">
                            <div className="relative h-36 bg-[#08090C]">
                              <img src={o.imageUrl} className="w-full h-full object-cover" />
                              <span className="absolute top-2 left-2 text-[10px] font-extrabold bg-[#FFC928] text-[#08090C] px-2 py-0.5 rounded">
                                {o.discountPercent}% OFF
                              </span>
                              <span className="absolute top-2 right-2 text-[10px] font-semibold bg-black/70 text-zinc-300 px-2 py-0.5 rounded border border-white/10">
                                {o.partnerName}
                              </span>
                            </div>
                            <div className="p-3 space-y-2">
                              <h4 className="font-bold text-xs text-white truncate">{o.title}</h4>
                              <div className="flex items-baseline justify-between">
                                <div className="flex items-baseline gap-1.5">
                                  <span className="font-extrabold text-sm text-white">₹{o.discountedPrice.toLocaleString()}</span>
                                  <span className="text-[10px] text-zinc-400 line-through">₹{o.originalPrice.toLocaleString()}</span>
                                </div>
                                <span className="text-[11px] font-bold text-[#FFC928]">Earn: {o.commissionRate}</span>
                              </div>
                              <div className="flex items-center gap-2 pt-1 border-t border-white/[0.06]">
                                <button 
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    navigator.clipboard.writeText(`${o.title}: ${o.affiliateUrl}`);
                                    confetti();
                                    alert('Link copied with your referral code!');
                                  }}
                                  className="p-1.5 rounded-lg bg-[#252833] text-zinc-300 hover:text-white"
                                >
                                  <Icons.Share2 />
                                </button>
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    openAffiliateLink(o.affiliateUrl, o.title, o.partnerId);
                                  }}
                                  className="flex-1 py-1.5 rounded-xl bg-gradient-to-r from-[#FFC928] to-[#D99B16] text-[#08090C] text-xs font-bold flex items-center justify-center gap-1"
                                >
                                  <span>View Offer</span>
                                  <Icons.ExternalLink />
                                </button>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB: EARNINGS */}
                {activeTab === 'earnings' && (
                  <div className="space-y-4">
                    <h2 className="font-display font-bold text-xl text-white">Earnings & Commissions</h2>
                    <div className="p-4 rounded-2xl bg-gradient-to-br from-[#1C1F27] to-[#15171D] border border-[#FFC928]/30">
                      <span className="text-[10px] text-zinc-400 font-semibold uppercase">Total Confirmed</span>
                      <div className="text-3xl font-extrabold text-[#FFC928] font-display mt-0.5">₹{currentUser.totalEarnings.toLocaleString()}</div>
                      <div className="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-white/[0.08] text-xs">
                        <div>
                          <span className="text-zinc-400 text-[10px] block">Pending Verification</span>
                          <span className="font-bold text-amber-400">₹{currentUser.pendingBalance.toLocaleString()}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 text-[10px] block">Available in Wallet</span>
                          <span className="font-bold text-emerald-400">₹{currentUser.walletBalance.toLocaleString()}</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <h3 className="font-bold text-xs text-white uppercase tracking-wider">Recent Transactions</h3>
                      <div className="p-3 rounded-xl bg-[#15171D] border border-white/[0.06] flex items-center justify-between text-xs">
                        <div>
                          <span className="font-bold text-white block">Samsung S24 Ultra Sale</span>
                          <span className="text-[10px] text-zinc-400">Amazon Commission</span>
                        </div>
                        <span className="font-bold text-[#FFC928]">+₹5,084</span>
                      </div>
                      <div className="p-3 rounded-xl bg-[#15171D] border border-white/[0.06] flex items-center justify-between text-xs">
                        <div>
                          <span className="font-bold text-white block">Referral Bonus: Rohit</span>
                          <span className="text-[10px] text-zinc-400">New user activation</span>
                        </div>
                        <span className="font-bold text-[#FFC928]">+₹250</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB: WALLET */}
                {activeTab === 'wallet' && (
                  <div className="space-y-4">
                    <h2 className="font-display font-bold text-xl text-white">Affiliate Wallet & Payout</h2>
                    <div className="p-4 rounded-2xl bg-[#15171D] border border-[#FFC928]/30">
                      <span className="text-xs text-zinc-400">Available Balance</span>
                      <div className="text-3xl font-extrabold text-[#FFC928] font-display">₹{currentUser.walletBalance.toLocaleString()}</div>
                    </div>

                    {/* Withdrawal Form */}
                    <div className="p-4 rounded-2xl bg-[#15171D] border border-white/[0.08] space-y-3">
                      <h3 className="font-bold text-sm text-white">Request Payout</h3>
                      <div>
                        <label className="text-[11px] text-zinc-400 block mb-1">Amount (₹)</label>
                        <input id="wdrAmount" type="number" defaultValue="2000" className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-white text-xs font-bold" />
                      </div>
                      <div>
                        <label className="text-[11px] text-zinc-400 block mb-1">UPI ID or Bank Details</label>
                        <input id="wdrUpi" type="text" defaultValue="kasifbhai@okaxis" className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-white text-xs font-mono" />
                      </div>
                      <button 
                        onClick={() => {
                          const amt = Number(document.getElementById('wdrAmount').value);
                          const upi = document.getElementById('wdrUpi').value;
                          if (amt > currentUser.walletBalance) {
                            alert('Insufficient available balance!');
                            return;
                          }
                          setCurrentUser(prev => ({ ...prev, walletBalance: prev.walletBalance - amt, pendingBalance: prev.pendingBalance + amt }));
                          setWithdrawals(prev => [{ id: 'w_' + Date.now(), amount: amt, method: 'UPI', details: upi, status: 'pending', date: 'Just now' }, ...prev]);
                          confetti();
                          alert('Withdrawal request submitted for admin review!');
                        }}
                        className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] text-xs font-bold hover:bg-[#D99B16]"
                      >
                        Submit Withdrawal Request
                      </button>
                    </div>

                    {/* Withdrawal History */}
                    <div className="space-y-2">
                      <h4 className="font-bold text-xs text-white">Withdrawal History</h4>
                      {withdrawals.map(w => (
                        <div key={w.id} className="p-3 rounded-xl bg-[#15171D] border border-white/[0.06] flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold text-white block">₹{w.amount.toLocaleString()} via {w.method}</span>
                            <span className="text-[10px] text-zinc-400 font-mono">{w.details}</span>
                          </div>
                          <span className={'px-2 py-0.5 rounded text-[10px] font-bold uppercase ' + (w.status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400')}>
                            {w.status}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB: OFFERS */}
                {activeTab === 'offers' && (
                  <div className="space-y-4">
                    <h2 className="font-display font-bold text-xl text-white">All Deals & Offers</h2>
                    <input 
                      type="text" 
                      value={searchQuery} 
                      onChange={e => setSearchQuery(e.target.value)} 
                      placeholder="Search deals, brands, products..." 
                      className="w-full px-3 py-2 rounded-xl bg-[#15171D] border border-white/10 text-xs text-white placeholder:text-zinc-500"
                    />
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {offers.filter(o => o.title.toLowerCase().includes(searchQuery.toLowerCase())).map(o => (
                        <div key={o.id} onClick={() => setSelectedOffer(o)} className="rounded-2xl bg-[#15171D] border border-white/[0.08] p-3 cursor-pointer hover:border-[#FFC928]/40">
                          <img src={o.imageUrl} className="w-full h-32 object-cover rounded-xl mb-2" />
                          <span className="text-[10px] text-[#FFC928] font-bold">{o.discountPercent}% OFF • {o.partnerName}</span>
                          <h4 className="font-bold text-xs text-white truncate mt-0.5">{o.title}</h4>
                          <div className="flex items-baseline justify-between mt-2">
                            <span className="font-extrabold text-sm text-white">₹{o.discountedPrice.toLocaleString()}</span>
                            <span className="text-xs font-bold text-[#FFC928]">Earn {o.commissionRate}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB: MORE */}
                {activeTab === 'more' && (
                  <div className="space-y-3">
                    <h2 className="font-display font-bold text-xl text-white">More Options</h2>
                    <button onClick={() => setShowShareModal(true)} className="w-full p-3 rounded-2xl bg-[#15171D] border border-white/[0.08] flex items-center justify-between text-xs text-white font-bold">
                      <span>Referral Link & Rewards</span>
                      <Icons.Share2 />
                    </button>
                    <button onClick={() => setShowAdminLogin(true)} className="w-full p-3 rounded-2xl bg-[#15171D] border border-[#FFC928]/30 flex items-center justify-between text-xs text-[#FFC928] font-bold">
                      <span>Administrator Login</span>
                      <Icons.Shield />
                    </button>
                  </div>
                )}

                {/* TAB: ADMIN (12 Modules) */}
                {activeTab === 'admin' && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="font-display font-bold text-xl text-white">Admin Management</h2>
                      <button onClick={() => setActiveTab('home')} className="text-xs text-[#FFC928] font-bold">Back to App</button>
                    </div>

                    {/* Partner Management (CRITICAL DYNAMIC URL CONTROL) */}
                    <div className="p-4 rounded-2xl bg-[#15171D] border border-[#FFC928]/40 space-y-3">
                      <div className="flex items-center justify-between">
                        <h3 className="font-bold text-sm text-white">Partner Management (Dynamic URLs)</h3>
                        <button 
                          onClick={() => {
                            const name = prompt('Partner Name (e.g. Croma):');
                            const url = prompt('Exact Affiliate URL:');
                            if (name && url) {
                              setPartners(prev => [...prev, { id: 'p_' + Date.now(), name, affiliateUrl: url, commissionInfo: 'Up to 10%', logo: 'https://images.unsplash.com/photo-1550009158-9ebf69173e03?w=160', description: 'Partner network', clickCount: 0 }]);
                            }
                          }}
                          className="px-2 py-1 rounded bg-[#FFC928] text-[#08090C] text-[10px] font-bold"
                        >
                          + Add Partner
                        </button>
                      </div>

                      <div className="space-y-2">
                        {partners.map(p => (
                          <div key={p.id} className="p-2.5 rounded-xl bg-[#08090C] border border-white/[0.08] space-y-1 text-xs">
                            <div className="flex justify-between font-bold text-white">
                              <span>{p.name}</span>
                              <span className="text-[#FFC928]">{p.clickCount} Clicks</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <input 
                                type="text" 
                                value={p.affiliateUrl} 
                                onChange={e => {
                                  const val = e.target.value;
                                  setPartners(prev => prev.map(item => item.id === p.id ? { ...item, affiliateUrl: val } : item));
                                }}
                                className="flex-1 px-2 py-1 rounded bg-[#15171D] border border-white/10 text-[10px] font-mono text-[#FFC928]"
                              />
                              <button 
                                onClick={() => {
                                  setPartners(prev => prev.filter(item => item.id !== p.id));
                                }}
                                className="text-rose-400 p-1"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Pending Withdrawals Approval Desk */}
                    <div className="p-4 rounded-2xl bg-[#15171D] border border-white/[0.08] space-y-3">
                      <h3 className="font-bold text-sm text-white">Pending Withdrawals Desk</h3>
                      {withdrawals.filter(w => w.status === 'pending').map(w => (
                        <div key={w.id} className="p-3 rounded-xl bg-[#08090C] border border-white/[0.06] flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold text-white block">₹{w.amount.toLocaleString()}</span>
                            <span className="text-[10px] text-zinc-400 font-mono">{w.details}</span>
                          </div>
                          <div className="flex gap-1.5">
                            <button 
                              onClick={() => {
                                setWithdrawals(prev => prev.map(item => item.id === w.id ? { ...item, status: 'paid' } : item));
                                setCurrentUser(prev => ({ ...prev, pendingBalance: Math.max(0, prev.pendingBalance - w.amount) }));
                                alert('Withdrawal marked as PAID!');
                              }}
                              className="px-2.5 py-1 rounded bg-emerald-500 text-[#08090C] font-bold text-[10px]"
                            >
                              Approve & Pay
                            </button>
                          </div>
                        </div>
                      ))}
                      {withdrawals.filter(w => w.status === 'pending').length === 0 && (
                        <p className="text-xs text-zinc-500">No pending requests.</p>
                      )}
                    </div>
                  </div>
                )}
              </main>

              {/* Fixed 5-Item Bottom Navigation Bar */}
              <nav className="absolute bottom-0 left-0 right-0 h-16 bg-[#08090C]/95 backdrop-blur-md border-t border-white/[0.08] flex items-center justify-around px-2 z-40">
                <button onClick={() => setActiveTab('home')} className={'flex flex-col items-center ' + (activeTab === 'home' ? 'text-[#FFC928]' : 'text-zinc-500')}>
                  <Icons.Home />
                  <span className="text-[9px] font-bold mt-1">Home</span>
                </button>
                <button onClick={() => setActiveTab('earnings')} className={'flex flex-col items-center ' + (activeTab === 'earnings' ? 'text-[#FFC928]' : 'text-zinc-500')}>
                  <Icons.TrendingUp />
                  <span className="text-[9px] font-bold mt-1">Earnings</span>
                </button>
                {/* Center Elevated WALLET Button with Golden Glow */}
                <div className="-mt-6">
                  <button onClick={() => setActiveTab('wallet')} className="w-14 h-14 rounded-full bg-gradient-to-tr from-[#8C6207] via-[#FFC928] to-[#FFF2B2] p-[2px] shadow-lg shadow-[#FFC928]/40 flex items-center justify-center">
                    <div className={'w-full h-full rounded-full flex items-center justify-center text-[#FFC928] ' + (activeTab === 'wallet' ? 'bg-[#1C1F27]' : 'bg-[#15171D]')}>
                      <Icons.Wallet />
                    </div>
                  </button>
                </div>
                <button onClick={() => setShowShareModal(true)} className="flex flex-col items-center text-zinc-500 hover:text-[#FFC928]">
                  <Icons.Share2 />
                  <span className="text-[9px] font-bold mt-1">Share</span>
                </button>
                <button onClick={() => setActiveTab('more')} className={'flex flex-col items-center ' + (activeTab === 'more' ? 'text-[#FFC928]' : 'text-zinc-500')}>
                  <Icons.Menu />
                  <span className="text-[9px] font-bold mt-1">More</span>
                </button>
              </nav>

            </div>
          </div>

          {/* Android Custom Tabs Simulator Modal */}
          {customTab.open && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-md bg-[#121419] rounded-2xl border border-white/10 overflow-hidden shadow-2xl p-4 text-center space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-2 text-xs">
                  <span className="font-bold text-white flex items-center gap-1"><Icons.Lock /> {customTab.title}</span>
                  <button onClick={() => setCustomTab({ open: false, url: '', title: '' })} className="text-zinc-400 hover:text-white"><Icons.X /></button>
                </div>
                <div className="p-3 bg-[#08090C] rounded-xl text-left border border-[#FFC928]/30">
                  <span className="text-[10px] text-zinc-400 uppercase font-semibold">Exact Admin Affiliate URL:</span>
                  <p className="text-xs font-mono text-[#FFC928] break-all mt-1">{customTab.url}</p>
                </div>
                <button onClick={() => window.open(customTab.url, '_blank')} className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs">
                  Continue to Merchant Website
                </button>
              </div>
            </div>
          )}

          {/* Secret Admin Login Modal */}
          {showAdminLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#15171D] rounded-2xl border border-[#FFC928]/40 p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-white text-base">Secret Admin Gateway</h3>
                  <button onClick={() => setShowAdminLogin(false)} className="text-zinc-400"><Icons.X /></button>
                </div>
                <p className="text-xs text-zinc-400">Triple tap detected. Enter password to unlock admin console.</p>
                <input id="adminPass" type="password" defaultValue="Admin@2026" className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-white text-xs" />
                <button 
                  onClick={() => {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    setActiveTab('admin');
                    confetti();
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs"
                >
                  Verify & Open Admin
                </button>
              </div>
            </div>
          )}

          {/* Share & Referral Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#15171D] rounded-2xl border border-white/10 p-6 shadow-2xl space-y-4 text-center">
                <h3 className="font-bold text-white text-lg">Invite & Earn ₹250</h3>
                <p className="text-xs text-zinc-400">Share your referral code. Friends get ₹100 welcome bonus on joining!</p>
                <div className="p-3 rounded-xl bg-[#08090C] border border-[#FFC928]/40 font-mono text-base font-bold text-[#FFC928]">
                  {currentUser.referralCode}
                </div>
                <button 
                  onClick={() => {
                    navigator.clipboard.writeText(currentUser.referralCode);
                    confetti();
                    alert('Referral code copied to clipboard!');
                    setShowShareModal(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs"
                >
                  Copy Referral Code
                </button>
              </div>
            </div>
          )}

          {/* Offer Details Modal */}
          {selectedOffer && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#15171D] rounded-2xl border border-white/10 overflow-hidden shadow-2xl space-y-3 p-4">
                <img src={selectedOffer.imageUrl} className="w-full h-40 object-cover rounded-xl" />
                <div className="flex items-center justify-between text-xs font-bold">
                  <span className="text-white">{selectedOffer.title}</span>
                  <button onClick={() => setSelectedOffer(null)} className="text-zinc-400"><Icons.X /></button>
                </div>
                <div className="flex items-baseline justify-between">
                  <span className="text-lg font-extrabold text-white">₹{selectedOffer.discountedPrice.toLocaleString()}</span>
                  <span className="text-xs font-bold text-[#FFC928]">You Earn: {selectedOffer.commissionRate}</span>
                </div>
                <button 
                  onClick={() => {
                    openAffiliateLink(selectedOffer.affiliateUrl, selectedOffer.title, selectedOffer.partnerId, selectedOffer.id);
                    setSelectedOffer(null);
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs"
                >
                  Open Offer via {selectedOffer.partnerName}
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
