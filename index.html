    // Smart EarnKaro / fktr.in / Flipkart / Amazon Link Decoder & Scraper Engine
    async function fetchProductFromAffiliateLink(rawUrl) {
      let targetUrl = rawUrl.trim();
      let resolvedUrl = targetUrl;
      let title = '';
      let imageUrl = '';
      let price = 0;
      let mrp = 0;
      let partnerName = 'Flipkart';

      // Helper to extract embedded URL if EarnKaro redirects to ?url=https%3A%2F%2Fwww.flipkart.com...
      const extractEmbeddedUrl = (str) => {
        try {
          const decoded = decodeURIComponent(decodeURIComponent(str));
          const fkMatch = decoded.match(/https?:\/\/(?:www\.|dl\.)?flipkart\.com\/[^\s"'<>\\&]+/i);
          if (fkMatch) return fkMatch[0];
          const amzMatch = decoded.match(/https?:\/\/(?:www\.)?amazon\.in\/[^\s"'<>\\&]+/i);
          if (amzMatch) return amzMatch[0];
          const mynMatch = decoded.match(/https?:\/\/(?:www\.)?myntra\.com\/[^\s"'<>\\&]+/i);
          if (mynMatch) return mynMatch[0];
        } catch (e) {}
        return null;
      };

      // Step 1: Try Microlink API first (Follows redirects + extracts metadata cleanly)
      try {
        const mlRes = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(targetUrl)}`);
        const mlJson = await mlRes.json();
        if (mlJson && mlJson.status === 'success' && mlJson.data) {
          const d = mlJson.data;
          if (d.url) {
            const embedded = extractEmbeddedUrl(d.url);
            resolvedUrl = embedded || d.url;
          }
          if (d.title && !d.title.toLowerCase().includes('just a moment') && !d.title.toLowerCase().includes('ekaro')) {
            title = d.title.replace(/Buy\s+/i, '').replace(/Online at Best Prices.*/i, '').trim();
          }
          if (d.image && d.image.url && !d.image.url.includes('ekaro')) {
            imageUrl = d.image.url;
          }
          // Try extracting price from description or title if present
          const textToScan = `${d.title || ''} ${d.description || ''}`;
          const priceMatch = textToScan.match(/(?:₹|Rs\.?|INR)\s*([0-9,]{2,9})/i);
          if (priceMatch) {
            price = parseInt(priceMatch[1].replace(/,/g, ''), 10);
          }
        }
      } catch (err) {
        console.warn('Microlink layer warning:', err);
      }

      // Step 2: Deep HTML Scrape via CORS Proxy to resolve fktr.in & get exact Live Price + JSON-LD
      const proxies = [
        (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
      ];

      for (const makeProxy of proxies) {
        if (title && imageUrl && price > 0) break;
        try {
          const res = await fetch(makeProxy(resolvedUrl));
          const data = await res.json().catch(async () => ({ contents: await res.text() }));
          const html = data.contents || '';
          const finalUrlFromProxy = (data.status && data.status.url) ? data.status.url : resolvedUrl;

          // Check if HTML or URL contains embedded Flipkart/Amazon destination URL
          const embedded = extractEmbeddedUrl(finalUrlFromProxy) || extractEmbeddedUrl(html);
          if (embedded && embedded !== resolvedUrl) {
            resolvedUrl = embedded;
            // Fetch the actual Flipkart/Amazon product page HTML
            const res2 = await fetch(makeProxy(resolvedUrl));
            const data2 = await res2.json().catch(async () => ({ contents: await res2.text() }));
            if (data2.contents) {
              parseProductHtml(data2.contents);
            }
          } else if (html) {
            parseProductHtml(html);
          }
        } catch (e) {
          console.warn('Proxy attempt failed:', e);
        }
      }

      function parseProductHtml(htmlString) {
        const doc = new DOMParser().parseFromString(htmlString, 'text/html');

        // 1. Check JSON-LD (Flipkart & Amazon standard structured data)
        const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
        scripts.forEach(s => {
          try {
            let json = JSON.parse(s.textContent);
            if (Array.isArray(json)) json = json[0];
            if (json && (json['@type'] === 'Product' || json.name)) {
              if (!title && json.name) title = json.name;
              if (!imageUrl && json.image) {
                imageUrl = Array.isArray(json.image) ? json.image[0] : json.image;
              }
              const offerPrice = json.offers?.price || json.offers?.[0]?.price;
              if (!price && offerPrice) price = parseInt(String(offerPrice).replace(/[^0-9]/g, ''), 10);
            }
          } catch (e) {}
        });

        // 2. Check OpenGraph Meta Tags
        if (!title) {
          const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || doc.title;
          if (ogTitle && !ogTitle.includes('Online Shopping')) {
            title = ogTitle.replace(/Buy\s+/i, '').replace(/Online at Best.*/i, '').trim();
          }
        }
        if (!imageUrl) {
          const ogImg = doc.querySelector('meta[property="og:image"]')?.getAttribute('content');
          if (ogImg) imageUrl = ogImg;
        }

        // 3. Check Flipkart / Amazon specific Price DOM classes
        if (!price) {
          const priceEl = doc.querySelector('.Nx9bqj, ._30jeq3, ._16Jk6d, .a-price-whole');
          if (priceEl) {
            const pVal = parseInt(priceEl.textContent.replace(/[^0-9]/g, ''), 10);
            if (pVal > 0) price = pVal;
          }
        }
        if (!mrp) {
          const mrpEl = doc.querySelector('.yRaY8j, ._3I9_wc, ._2p6lqe');
          if (mrpEl) {
            const mVal = parseInt(mrpEl.textContent.replace(/[^0-9]/g, ''), 10);
            if (mVal > 0) mrp = mVal;
          }
        }

        // 4. Regex fallback for ₹ price in raw HTML
        if (!price) {
          const regexPrice = htmlString.match(/"price"\s*:\s*"?([0-9]{2,7})"?/i) || htmlString.match(/₹\s*([0-9,]{2,8})/);
          if (regexPrice) {
            price = parseInt(regexPrice[1].replace(/,/g, ''), 10);
          }
        }
      }

      // Step 3: Clean up & Smart Fallbacks from URL slug if Flipkart bot-check blocked full HTML
      const lowerUrl = (resolvedUrl + ' ' + rawUrl).toLowerCase();
      if (lowerUrl.includes('amazon') || lowerUrl.includes('amzn')) partnerName = 'Amazon';
      else if (lowerUrl.includes('myntra')) partnerName = 'Myntra';
      else if (lowerUrl.includes('ajio')) partnerName = 'Ajio';
      else if (lowerUrl.includes('meesho')) partnerName = 'Meesho';
      else partnerName = 'Flipkart';

      // Extract readable product name from Flipkart/Amazon URL slug if title is still empty
      if (!title && resolvedUrl.includes('/p/')) {
        try {
          const slug = resolvedUrl.split('flipkart.com/')[1]?.split('/p/')[0];
          if (slug) {
            title = slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
          }
        } catch (e) {}
      }

      if (!mrp && price > 0) {
        mrp = Math.round(price * 1.25); // Estimate 20% off if MRP wasn't listed separately
      }

      return {
        title: title || '',
        imageUrl: imageUrl || '',
        discountedPrice: price || '',
        originalPrice: mrp || '',
        partnerName,
        resolvedUrl,
        affiliateUrl: rawUrl.trim() // Always preserve the user's EarnKaro link!

                      <div className="flex items-center justify-between">
                        <h3 className="font-display font-bold text-sm text-[#FFC928] flex items-center gap-1.5">
                          <Icons.Sparkles />
                          <span>Add Product via EarnKaro Link (Auto-Fetch)</span>
                        </h3>
                        <span className="text-[10px] bg-[#FFC928]/20 text-[#FFC928] px-2 py-0.5 rounded font-bold">fktr.in / amzn.to</span>
                      </div>

                      <p className="text-[11px] text-zinc-400">
                        Flipkart/Amazon से प्रोडक्ट लिंक लेकर EarnKaro पर अपना प्रॉफिट लिंक (`https://fktr.in/...`) बनाएं और नीचे पेस्ट करें:
                      </p>

                      {/* Link Input + Auto-Fetch Button */}
                      <div className="flex flex-col sm:flex-row gap-2">
                        <input 
                          type="text"
                          value={ekUrl}
                          onChange={(e) => setEkUrl(e.target.value)}
                          onPaste={(e) => {
                            const pasted = e.clipboardData.getData('text');
                            setEkUrl(pasted);
                            setTimeout(() => handleAutoFetchLink(pasted), 150);
                          }}
                          placeholder="Paste EarnKaro link here (e.g. https://fktr.in/tj5Ye2T)"
                          className="flex-1 px-3 py-2.5 rounded-xl bg-[#08090C] border border-[#FFC928]/50 text-xs text-white font-mono focus:outline-none focus:border-[#FFC928]"
                        />
                        <button
                          onClick={() => handleAutoFetchLink()}
                          disabled={isFetchingMeta}
                          className="px-4 py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-extrabold text-xs flex items-center justify-center gap-1.5 hover:bg-[#D99B16] disabled:opacity-50 shrink-0"
                        >
                          <Icons.Refresh />
                          <span>{isFetchingMeta ? 'Fetching...' : '⚡ Auto-Fetch Details'}</span>
                        </button>
                      </div>

                      {fetchStatusMsg && (
                        <div className="p-2.5 rounded-xl bg-[#08090C] border border-white/10 text-[11px] text-[#FFC928]">
                          {fetchStatusMsg}
                        </div>
                      )}

                      {/* Auto-Filled Product Fields + Live Image Preview */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                        <div className="space-y-2">
                          <div>
                            <label className="text-[10px] text-zinc-400 block mb-1">Product Title (Auto-Filled)</label>
                            <input 
                              type="text"
                              value={prodTitle}
                              onChange={e => setProdTitle(e.target.value)}
                              placeholder="Product Name"
                              className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-xs text-white"
                            />
                          </div>

                          <div>
                            <label className="text-[10px] text-zinc-400 block mb-1">Product Image URL (Auto-Filled)</label>
                            <input 
                              type="text"
                              value={prodImage}
                              onChange={e => setProdImage(e.target.value)}
                              placeholder="https://rukminim2.flixcart.com/..."
                              className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-xs text-white font-mono"
                            />
                          </div>

                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="text-[10px] text-zinc-400 block mb-1">Live Deal Price (₹)</label>
                              <input 
                                type="number"
                                value={prodPrice}
                                onChange={e => setProdPrice(e.target.value)}
                                placeholder="e.g. 1499"
                                className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-xs text-[#FFC928] font-bold"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-zinc-400 block mb-1">Original MRP (₹)</label>
                              <input 
                                type="number"
                                value={prodMrp}
                                onChange={e => setProdMrp(e.target.value)}
                                placeholder="e.g. 2499"
                                className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-xs text-zinc-300"
                              />
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="text-[10px] text-zinc-400 block mb-1">Store / Partner</label>
                              <select 
                                value={prodPartner}
                                onChange={e => setProdPartner(e.target.value)}
                                className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-xs text-white"
                              >
                                <option value="Flipkart">Flipkart</option>
                                <option value="Amazon">Amazon</option>
                                <option value="Myntra">Myntra</option>
                                <option value="Ajio">Ajio</option>
                                <option value="Meesho">Meesho</option>
                              </select>
                            </div>
                            <div>
                              <label className="text-[10px] text-zinc-400 block mb-1">User Commission Text</label>
                              <input 
                                type="text"
                                value={prodCommission}
                                onChange={e => setProdCommission(e.target.value)}
                                placeholder="e.g. 7% (₹150)"
                                className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-xs text-white"
                              />
                            </div>
                          </div>
                        </div>

                        {/* Live Preview Box */}
                        <div className="rounded-xl bg-[#08090C] border border-white/10 p-3 flex flex-col items-center justify-center text-center">
                          <span className="text-[10px] text-zinc-500 uppercase font-bold mb-2">Live Product Card Preview</span>
                          {prodImage ? (
                            <img src={prodImage} alt="Preview" className="h-28 object-contain rounded-lg bg-white p-1.5 mb-2" />
                          ) : (
                            <div className="h-28 w-full rounded-lg bg-[#15171D] flex items-center justify-center text-xs text-zinc-500 mb-2">
                              Image Preview
                            </div>
                          )}
                          <p className="text-xs font-bold text-white line-clamp-2">{prodTitle || 'Product Title Preview'}</p>
                          <p className="text-sm font-extrabold text-[#FFC928] mt-1">
                            {prodPrice ? `₹${Number(prodPrice).toLocaleString()}` : '₹0'}
                          </p>
                        </div>
                      </div>

                      <button
                        onClick={handleAddProductOffer}
                        className="w-full py-3 rounded-xl bg-gradient-to-r from-[#FFC928] to-[#D99B16] text-[#08090C] font-extrabold text-xs shadow-lg"
                      >
                        + Publish Product with EarnKaro Commission Link
                      </button>
                    </div>

                    {/* Manage Existing Products & Sync Live Price */}
                    <div className="p-4 rounded-2xl bg-[#15171D] border border-white/[0.08] space-y-3">
                      <h3 className="font-bold text-sm text-white">Manage Products & Live Prices ({offers.length})</h3>
                      <div className="space-y-2">
                        {offers.map(o => (
                          <div key={o.id} className="p-3 rounded-xl bg-[#08090C] border border-white/[0.08] flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                            <div className="flex items-center gap-2.5">
                              <img src={o.imageUrl} className="w-10 h-10 rounded bg-white object-contain p-0.5 shrink-0" />
                              <div>
                                <div className="font-bold text-white line-clamp-1">{o.title}</div>
                                <div className="text-[11px] text-[#FFC928] font-bold">
                                  Live Price: ₹{Number(o.discountedPrice).toLocaleString()} • <span className="text-zinc-400 font-mono">{o.affiliateUrl}</span>
                                </div>
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              <button
                                onClick={() => handleRefreshOfferPrice(o.id, o.affiliateUrl)}
                                className="px-2.5 py-1.5 rounded-lg bg-[#FFC928]/15 border border-[#FFC928]/40 text-[#FFC928] font-bold text-[10px] flex items-center gap-1"
                              >
                                <Icons.Refresh /> Sync Price
                              </button>
                              <button
                                onClick={() => setOffers(prev => prev.filter(item => item.id !== o.id))}
                                className="p-1.5 rounded-lg bg-rose-500/15 text-rose-400 hover:bg-rose-500/30"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Partner Management */}
                    <div className="p-4 rounded-2xl bg-[#15171D] border border-white/[0.08] space-y-3">
                      <div className="flex items-center justify-between">
                        <h3 className="font-bold text-sm text-white">Partner Stores (Dynamic URLs)</h3>
                        <button 
                          onClick={() => {
                            const name = prompt('Partner Name (e.g. Croma):');
                            const url = prompt('Exact Affiliate URL:');
                            if (name && url) {
                              setPartners(prev => [...prev, { id: 'p_' + Date.now(), name, affiliateUrl: url, commissionInfo: 'Up to 10%', logo: '', description: 'Partner network', clickCount: 0 }]);
                            }
                          }}
                          className="px-2 py-1 rounded bg-[#FFC928] text-[#08090C] text-[10px] font-bold"
                        >
                          + Add Partner
                        </button>
                      </div>

                      <div className="space-y-2">
                        {partners.map(p => (
                          <div key={p.id} className="p-2.5 rounded-xl bg-[#08090C] border border-white/[0.08] space-y-1 text-xs">
                            <div className="flex justify-between font-bold text-white">
                              <span>{p.name}</span>
                              <span className="text-[#FFC928]">{p.clickCount} Clicks</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <input 
                                type="text" 
                                value={p.affiliateUrl} 
                                onChange={e => {
                                  const val = e.target.value;
                                  setPartners(prev => prev.map(item => item.id === p.id ? { ...item, affiliateUrl: val } : item));
                                }}
                                className="flex-1 px-2 py-1 rounded bg-[#15171D] border border-white/10 text-[10px] font-mono text-[#FFC928]"
                              />
                              <button 
                                onClick={() => setPartners(prev => prev.filter(item => item.id !== p.id))}
                                className="text-rose-400 p-1"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Fixed 5-Item Bottom Navigation Bar */}
              <nav className="fixed bottom-0 left-0 right-0 max-w-7xl mx-auto h-16 bg-[#08090C]/95 backdrop-blur-md border-t border-white/[0.08] flex items-center justify-around px-2 z-40">
                <button onClick={() => setActiveTab('home')} className={'flex flex-col items-center ' + (activeTab === 'home' ? 'text-[#FFC928]' : 'text-zinc-500')}>
                  <Icons.Home />
                  <span className="text-[9px] font-bold mt-1">Home</span>
                </button>
                <button onClick={() => setActiveTab('earnings')} className={'flex flex-col items-center ' + (activeTab === 'earnings' ? 'text-[#FFC928]' : 'text-zinc-500')}>
                  <Icons.TrendingUp />
                  <span className="text-[9px] font-bold mt-1">Earnings</span>
                </button>
                <div className="-mt-6">
                  <button onClick={() => setActiveTab('wallet')} className="w-14 h-14 rounded-full bg-gradient-to-tr from-[#8C6207] via-[#FFC928] to-[#FFF2B2] p-[2px] shadow-lg shadow-[#FFC928]/40 flex items-center justify-center">
                    <div className={'w-full h-full rounded-full flex items-center justify-center text-[#FFC928] ' + (activeTab === 'wallet' ? 'bg-[#1C1F27]' : 'bg-[#15171D]')}>
                      <Icons.Wallet />
                    </div>
                  </button>
                </div>
                <button onClick={() => setShowShareModal(true)} className="flex flex-col items-center text-zinc-500 hover:text-[#FFC928]">
                  <Icons.Share2 />
                  <span className="text-[9px] font-bold mt-1">Share</span>
                </button>
                <button onClick={() => setActiveTab('more')} className={'flex flex-col items-center ' + (activeTab === 'more' ? 'text-[#FFC928]' : 'text-zinc-500')}>
                  <Icons.Menu />
                  <span className="text-[9px] font-bold mt-1">More</span>
                </button>
              </nav>

            </div>
          </div>

          {/* Outbound Link Redirect Modal */}
          {customTab.open && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-md bg-[#121419] rounded-2xl border border-white/10 overflow-hidden shadow-2xl p-4 text-center space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-2 text-xs">
                  <span className="font-bold text-white flex items-center gap-1"><Icons.Lock /> {customTab.title}</span>
                  <button onClick={() => setCustomTab({ open: false, url: '', title: '' })} className="text-zinc-400 hover:text-white"><Icons.X /></button>
                </div>
                <div className="p-3 bg-[#08090C] rounded-xl text-left border border-[#FFC928]/30">
                  <span className="text-[10px] text-zinc-400 uppercase font-semibold">Your Active Commission Link:</span>
                  <p className="text-xs font-mono text-[#FFC928] break-all mt-1">{customTab.url}</p>
                </div>
                <button onClick={() => window.open(customTab.url, '_blank')} className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs">
                  Continue to Store & Buy
                </button>
              </div>
            </div>
          )}

          {/* Secret Admin Login Modal */}
          {showAdminLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#15171D] rounded-2xl border border-[#FFC928]/40 p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-white text-base">Secret Admin Gateway</h3>
                  <button onClick={() => setShowAdminLogin(false)} className="text-zinc-400"><Icons.X /></button>
                </div>
                <p className="text-xs text-zinc-400">Enter password to unlock EarnKaro Auto-Fetch Admin Panel.</p>
                <input id="adminPass" type="password" defaultValue="Admin@2026" className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-white text-xs" />
                <button 
                  onClick={() => {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    setActiveTab('admin');
                    if (window.confetti) confetti();
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs"
                >
                  Verify & Open Admin
                </button>
              </div>
            </div>
          )}

          {/* Share & Referral Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#15171D] rounded-2xl border border-white/10 p-6 shadow-2xl space-y-4 text-center">
                <h3 className="font-bold text-white text-lg">Invite & Earn ₹250</h3>
                <p className="text-xs text-zinc-400">Share your referral code. Friends get ₹100 welcome bonus on joining!</p>
                <div className="p-3 rounded-xl bg-[#08090C] border border-[#FFC928]/40 font-mono text-base font-bold text-[#FFC928]">
                  {currentUser.referralCode}
                </div>
                <button 
                  onClick={() => {
                    navigator.clipboard.writeText(currentUser.referralCode);
                    if (window.confetti) confetti();
                    alert('Referral code copied to clipboard!');
                    setShowShareModal(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs"
                >
                  Copy Referral Code
                </button>
              </div>
            </div>
          )}

          {/* Offer Details Modal */}
          {selectedOffer && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-[#15171D] rounded-2xl border border-white/10 overflow-hidden shadow-2xl space-y-3 p-4">
                <div className="h-44 bg-white rounded-xl flex items-center justify-center p-2">
                  <img src={selectedOffer.imageUrl} className="max-h-full max-w-full object-contain" />
                </div>
                <div className="flex items-start justify-between gap-2 text-xs font-bold">
                  <span className="text-white">{selectedOffer.title}</span>
                  <button onClick={() => setSelectedOffer(null)} className="text-zinc-400 shrink-0"><Icons.X /></button>
                </div>
                <div className="flex items-baseline justify-between">
                  <span className="text-lg font-extrabold text-white">₹{Number(selectedOffer.discountedPrice).toLocaleString()}</span>
                  <span className="text-xs font-bold text-[#FFC928]">You Earn: {selectedOffer.commissionRate}</span>
                </div>
                <button 
                  onClick={() => {
                    openAffiliateLink(selectedOffer.affiliateUrl, selectedOffer.title, selectedOffer.partnerId);
                    setSelectedOffer(null);
                  }}
                  className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold text-xs"
                >
                  Open Offer via {selectedOffer.partnerName}
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
