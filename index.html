<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AffiliatePro Dashboard</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #070709;
      --card-bg: #121216;
      --card-bg-grad: linear-gradient(145deg, #18171c 0%, #0e0e12 100%);
      --gold-primary: #f5b921;
      --gold-light: #ffd65a;
      --gold-dark: #c48b0c;
      --gold-grad: linear-gradient(135deg, #ffe074 0%, #f5b921 50%, #c88a08 100%);
      --text-white: #ffffff;
      --text-muted: #8e8e99;
      --border-subtle: rgba(245, 185, 33, 0.22);
      --border-glow: rgba(245, 185, 33, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: var(--text-white);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Mobile App Container */
    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-dark);
      min-height: 100vh;
      padding: 16px 14px 95px;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 40px rgba(245, 185, 33, 0.08);
    }

    /* 1. Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .crown-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,185,33,0.2) 0%, rgba(0,0,0,0) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--gold-primary);
      filter: drop-shadow(0 2px 6px rgba(245, 185, 33, 0.4));
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.2px;
    }

    .brand-text h1 span {
      color: var(--gold-primary);
    }

    .brand-text p {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wallet-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg-grad);
      border: 1px solid var(--border-subtle);
      padding: 5px 11px;
      border-radius: 12px;
    }

    .wallet-pill i {
      color: var(--gold-primary);
      font-size: 18px;
    }

    .wallet-info {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .wallet-info .amount {
      font-size: 12.5px;
      font-weight: 600;
    }

    .wallet-info .label {
      font-size: 10px;
      color: var(--text-muted);
    }

    .notify-btn {
      position: relative;
      color: #c7c7d1;
      font-size: 20px;
      cursor: pointer;
    }

    .notify-btn .dot {
      position: absolute;
      top: 0px;
      right: -1px;
      width: 7px;
      height: 7px;
      background: #ff3b30;
      border-radius: 50%;
    }

      height: 3
