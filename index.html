                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                              </div>

                        <div className="p-3.5 rounded-xl bg-[#08090C] border border-[#FFC928]/30 space-y-3">

                  <span className="text-[9px] font-bold mt-1">Home</span>

                <button onClick={() => setActiveTab('earnings')} className={'flex flex-col items-center ' + (activeTab === 'earnings' ? 'text-[#FFC928]' : 'text-zinc-500')}>

                </button>
                <button onClick={() => setActiveTab('more')} className={'flex flex-col items-center ' + (activeTab === 'more' ? 'text-[#FFC928]' : 'text-zinc-500')}>

                </button>

          </div>

          {/* Android Custom Tabs Simulator Modal */}
          {customTab.open && (

                  Continue to Merchant Website
                </button>
              </div>

          )}

          {/* Secret Admin Login Modal */}
          {showAdminLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">

                  <button onClick={() => setShowAdminLogin(false)} className="text-zinc-400"><Icons.X /></button>

                <p className="text-xs text-zinc-400">Triple tap detected. Enter password to unlock 12-Module Admin Console.</p>
                <input id="adminPassInput" type="password" defaultValue={adminPassword} className="w-full px-3 py-2 rounded-xl bg-[#08090C] border border-white/10 text-white text-xs" />

                  onClick={() => {

                >
                  Verify & Open Admin
                </button>
              </div>
            </div>
          )}

          {/* Share & Referral Modal */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">

                  {currentUser.referralCode}
