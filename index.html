  const [partners, setPartners] = useState(() => load(SK.P, initPartners));
  const [offers, setOffers] = useState(() => load(SK.O, initOffers));
  const [banners, setBanners] = useState(() => load(SK.B, initBanners));
  const [withdrawals, setWithdrawals] = useState(() => load(SK.W, initWithdrawals));
  const [commissions, setCommissions] = useState(() => load(SK.CM, initComms));
  const [clicks, setClicks] = useState(() => load(SK.C, []));
  const [notifications, setNotifications] = useState(() => load(SK.N, initNotifs));
  const [settings, setSettings] = useState(() => load(SK.S, initSettings));
  const [auditLogs, setAuditLogs] = useState(() => load(SK.A, initAudits));

  const [activeTab, setActiveTab] = useState('home');
  const [selectedOffer, setSelectedOffer] = useState(null);
  const [selectedPartner, setSelectedPartner] = useState(null);
  const [customTab, setCustomTab] = useState(null);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [authMode, setAuthMode] = useState(null);
  const [showShare, setShowShare] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminEmail, setAdminEmail] = useState(null);
  const [taps, setTaps] = useState([]);

  // Load Firestore data safely on app mount to sync across devices
  useEffect(() => {
    if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
      const db = firebase.firestore();
      db.collection('affiliateProData').get().then(snapshot => {
        if (!snapshot.empty) {
          snapshot.forEach(doc => {
            try {
              const parsed = JSON.parse(doc.data().data);
              if (parsed) {
                switch (doc.id) {
                  case SK.CU: setCurrentUser(parsed); break;
                  case SK.U: setUsers(parsed); break;
                  case SK.P: setPartners(parsed); break;
                  case SK.O: setOffers(parsed); break;
                  case SK.B: setBanners(parsed); break;
                  case SK.W: setWithdrawals(parsed); break;
                  case SK.CM: setCommissions(parsed); break;
                  case SK.C: setClicks(parsed); break;
                  case SK.N: setNotifications(parsed); break;
                  case SK.S: setSettings(parsed); break;
                  case SK.A: setAuditLogs(parsed); break;
                }
              }
            } catch (e) {}
          });
        }
      }).catch(err => console.error("Firebase sync error: ", err));
    }
  }, []);

  useEffect(() => save(SK.CU, currentUser), [currentUser]);
  useEffect(() => save(SK.U, users), [users]);
  useEffect(() => save(SK.P, partners), [partners]);
  useEffect(() => save(SK.O, offers), [offers]);
  useEffect(() => save(SK.B, banners), [banners]);
  useEffect(() => save(SK.W, withdrawals), [withdrawals]);
  useEffect(() => save(SK.CM, commissions), [commissions]);
  useEffect(() => save(SK.C, clicks), [clicks]);
  useEffect(() => save(SK.N, notifications), [notifications]);
  useEffect(() => save(SK.S, settings), [settings]);
  useEffect(() => save(SK.A, auditLogs), [auditLogs]);

  const addAudit = (action, details, email) => setAuditLogs(p => [{ id:'a'+Date.now(), adminEmail:email||adminEmail||'admin', action, details, timestamp:new Date().toISOString() }, ...p]);
  const handleLogoTap = () => {
    const now = Date.now(), r = [...taps, now].filter(t => now - t < 1500);
    setTaps(r);
    if (r.length >= 3) { setTaps([]); setShowAdminLogin(true); }
  };

  const openAffiliateLink = (url, title, pid, oid) => {
    const pt = partners.find(p => p.id === pid), of = offers.find(o => o.id === oid);
    setClicks(p => [{ id:'clk'+Date.now(), partnerName:pt?.name, offerTitle:of?.title, targetUrl:url, timestamp:new Date().toISOString() }, ...p]);
    if (pid) setPartners(p => p.map(x => x.id === pid ? { ...x, clickCount: x.clickCount + 1 } : x));
    if (oid) setOffers(p => p.map(x => x.id === oid ? { ...x, clickCount: (x.clickCount||0) + 1 } : x));
    if (currentUser) {
      const u = { ...currentUser, totalClicks: currentUser.totalClicks + 1 };
      setCurrentUser(u); setUsers(p => p.map(x => x.id === u.id ? u : x));
    }
    setCustomTab({ url, title: title || 'Affiliate Partner' });
  };

  const loginUser = email => {
    const f = users.find(u => u.email.toLowerCase() === email.toLowerCase());
    if (f) { if (f.status === 'suspended') return { success:false, message:'Account suspended.' }; setCurrentUser(f); setAuthMode(null); return { success:true }; }
    const nu = { id:'u'+Date.now(), name:email.split('@')[0], email, role:'user', referralCode:'AFF-'+Math.random().toString(36).slice(2,6).toUpperCase(), status:'active', createdAt:new Date().toISOString(), walletBalance:0, pendingBalance:0, totalEarnings:0, totalClicks:0, totalReferrals:0 };
    setUsers(p => [nu, ...p]); setCurrentUser(nu); setAuthMode(null); return { success:true };
  };
  const signupUser = (name, email, phone, ref) => {
    if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) return { success:false, message:'Email already exists.' };
    const ru = ref ? users.find(u => u.referralCode.toUpperCase() === ref.trim().toUpperCase()) : null;
    const nu = { id:'u'+Date.now(), name, email, phoneNumber:phone, role:'user', referralCode:'AFF-'+name.slice(0,3).toUpperCase()+'-'+Math.floor(100+Math.random()*900), status:'active', createdAt:new Date().toISOString(), walletBalance:100, pendingBalance:0, totalEarnings:100, totalClicks:0, totalReferrals:0 };
    if (ru) {
      const amt = settings.referralRewardAmount || 250;
      setCommissions(p => [{ id:'cm'+Date.now(), userId:ru.id, userEmail:ru.email, partnerId:'app', partnerName:'AffiliatePro Rewards', amount:amt, status:'approved', reason:'Referral bonus: '+name, createdAt:new Date().toISOString() }, ...p]);
      setUsers(p => p.map(u => u.id === ru.id ? { ...u, walletBalance:u.walletBalance+amt, totalEarnings:u.totalEarnings+amt, totalReferrals:u.totalReferrals+1 } : u));
    }
    setUsers(p => [nu, ...p]); setCurrentUser(nu); setAuthMode(null); fireConfetti(); return { success:true };
  };
  const loginAdmin = (email, pass) => {
    const c = email.trim().toLowerCase();
    if (!['kasifbhaityu568@gmail.com','admin@affiliatepro.app','admin'].includes(c)) return { success:false, message:'Unauthorized email.' };
    if (pass.length < 4) return { success:false, message:'Invalid password.' };
    setIsAdmin(true); setAdminEmail(c); setShowAdminLogin(false); setActiveTab('admin'); addAudit('ADMIN_LOGIN', 'Authenticated', c);
    return { success:true };
  };

  const requestWithdrawal = (amount, method, details) => {
    if (!currentUser) return { success:false, message:'Please login first.' };
    if (amount < settings.minWithdrawalAmount) return { success:false, message:'Min withdrawal ₹'+settings.minWithdrawalAmount };
    if (amount > settings.maxWithdrawalAmount) return { success:false, message:'Max limit ₹'+settings.maxWithdrawalAmount };
    if (amount > currentUser.walletBalance) return { success:false, message:'Insufficient balance.' };
    const req = { id:'w'+Date.now(), userId:currentUser.id, userEmail:currentUser.email, userName:currentUser.name, amount, paymentMethod:method, payoutDetails:details, status:'pending', createdAt:new Date().toISOString() };
    const upd = { ...currentUser, walletBalance:currentUser.walletBalance-amount, pendingBalance:currentUser.pendingBalance+amount };
    setCurrentUser(upd); setUsers(p => p.map(u => u.id === upd.id ? upd : u)); setWithdrawals(p => [req, ...p]);
    setNotifications(p => [{ id:'n'+Date.now(), title:'Withdrawal Submitted', message:`₹${amount.toLocaleString()} via ${method} pending approval.`, type:'withdrawal', read:false, createdAt:new Date().toISOString() }, ...p]);
    return { success:true, message:'Withdrawal request submitted!' };
  };

  const approveWithdrawal = id => { setWithdrawals(p => p.map(w => w.id === id ? { ...w, status:'approved' } : w)); addAudit('APPROVE_WDR', 'Approved #'+id); };
  const rejectWithdrawal = (id, reason) => {
    const it = withdrawals.find(w => w.id === id); if (!it) return;
    setUsers(p => p.map(u => u.id === it.userId ? { ...u, walletBalance:u.walletBalance+it.amount, pendingBalance:Math.max(0,u.pendingBalance-it.amount) } : u));
    if (currentUser?.id === it.userId) setCurrentUser(u => u ? { ...u, walletBalance:u.walletBalance+it.amount, pendingBalance:Math.max(0,u.pendingBalance-it.amount) } : null);
    setWithdrawals(p => p.map(w => w.id === id ? { ...w, status:'rejected', adminNotes:reason } : w));
    setNotifications(p => [{ id:'n'+Date.now(), title:'Withdrawal Rejected', message:`₹${it.amount} refunded to wallet.`, type:'withdrawal', read:false, createdAt:new Date().toISOString() }, ...p]);
    addAudit('REJECT_WDR', 'Rejected & refunded #'+id);
  };
  const markWithdrawalPaid = (id, tx) => {
    const it = withdrawals.find(w => w.id === id); if (!it) return;
    setUsers(p => p.map(u => u.id === it.userId ? { ...u, pendingBalance:Math.max(0,u.pendingBalance-it.amount) } : u));
    if (currentUser?.id === it.userId) setCurrentUser(u => u ? { ...u, pendingBalance:Math.max(0,u.pendingBalance-it.amount) } : null);
    setWithdrawals(p => p.map(w => w.id === id ? { ...w, status:'paid', transactionRef:tx } : w));
    setNotifications(p => [{ id:'n'+Date.now(), title:'Payout Complete!', message:`₹${it.amount.toLocaleString()} paid. Ref: ${tx}`, type:'withdrawal', read:false, createdAt:new Date().toISOString() }, ...p]);
    addAudit('PAY_WDR', 'Paid #'+id+' Ref:'+tx);
  };

  const addCommission = (userId, partnerId, amount, reason) => {
    const pt = partners.find(x => x.id === partnerId), u = users.find(x => x.id === userId);
    setCommissions(p => [{ id:'cm'+Date.now(), userId, userEmail:u?.email||'user', partnerId, partnerName:pt?.name||'Partner', amount, status:'approved', reason, createdAt:new Date().toISOString() }, ...p]);
    setUsers(p => p.map(x => x.id === userId ? { ...x, walletBalance:x.walletBalance+amount, totalEarnings:x.totalEarnings+amount } : x));
    if (currentUser?.id === userId) setCurrentUser(x => x ? { ...x, walletBalance:x.walletBalance+amount, totalEarnings:x.totalEarnings+amount } : null);
    setNotifications(p => [{ id:'n'+Date.now(), title:`Commission Added: ₹${amount.toLocaleString()}!`, message:reason, type:'commission', read:false, createdAt:new Date().toISOString() }, ...p]);
    addAudit('CREDIT_COMM', `₹${amount} to ${u?.email}`);
  };
  const approveCommission = id => {
    const it = commissions.find(c => c.id === id); if (!it || it.status === 'approved') return;
    setCommissions(p => p.map(c => c.id === id ? { ...c, status:'approved' } : c));
    setUsers(p => p.map(u => u.id === it.userId ? { ...u, walletBalance:u.walletBalance+it.amount, pendingBalance:Math.max(0,u.pendingBalance-it.amount), totalEarnings:u.totalEarnings+it.amount } : u));
    if (currentUser?.id === it.userId) setCurrentUser(u => u ? { ...u, walletBalance:u.walletBalance+it.amount, pendingBalance:Math.max(0,u.pendingBalance-it.amount), totalEarnings:u.totalEarnings+it.amount } : null);
    addAudit('APPROVE_COMM', 'Approved #'+id);
  };

  return (
    <AppCtx.Provider value={{
      currentUser, setCurrentUser, users, partners, offers, banners, withdrawals, commissions, clicks, notifications, settings, auditLogs,
      unreadCount: notifications.filter(n => !n.read).length, activeTab, setActiveTab, selectedOffer, setSelectedOffer, selectedPartner, setSelectedPartner,
      customTab, setCustomTab, showAdminLogin, setShowAdminLogin, authMode, setAuthMode, showShare, setShowShare, isAdmin, adminEmail,
      handleLogoTap, openAffiliateLink, loginUser, signupUser, logoutUser: () => setCurrentUser(null),
      loginAdmin, logoutAdmin: () => { setIsAdmin(false); setAdminEmail(null); setActiveTab('home'); },
      openAdminConsole: () => isAdmin ? setActiveTab('admin') : setShowAdminLogin(true), requestWithdrawal,
      addPartner: d => { setPartners(p => [...p, { ...d, id:'p'+Date.now(), clickCount:0 }]); addAudit('ADD_PARTNER', d.name); },
      updatePartner: u => { setPartners(p => p.map(x => x.id === u.id ? u : x)); addAudit('UPDATE_PARTNER', u.name); },
      deletePartner: id => { setPartners(p => p.filter(x => x.id !== id)); addAudit('DELETE_PARTNER', id); },
      addOffer: d => { setOffers(p => [{ ...d, id:'o'+Date.now(), clickCount:0 }, ...p]); addAudit('ADD_OFFER', d.title); },
      updateOffer: u => { setOffers(p => p.map(x => x.id === u.id ? u : x)); addAudit('UPDATE_OFFER', u.title); },
      deleteOffer: id => { setOffers(p => p.filter(x => x.id !== id)); addAudit('DELETE_OFFER', id); },
      addBanner: d => { setBanners(p => [...p, { ...d, id:'b'+Date.now() }]); addAudit('ADD_BANNER', d.title); },
      updateBanner: u => { setBanners(p => p.map(x => x.id === u.id ? u : x)); addAudit('UPDATE_BANNER', u.title); },
      deleteBanner: id => { setBanners(p => p.filter(x => x.id !== id)); addAudit('DELETE_BANNER', id); },
      approveWithdrawal, rejectWithdrawal, markWithdrawalPaid, addCommission, approveCommission,
      rejectCommission: id => { setCommissions(p => p.map(c => c.id === id ? { ...c, status:'rejected' } : c)); addAudit('REJECT_COMM', id); },
      markCommissionPaid: (id, tx) => { setCommissions(p => p.map(c => c.id === id ? { ...c, status:'paid', transactionRef:tx } : c)); addAudit('PAY_COMM', id); },
      toggleUserStatus: id => { setUsers(p => p.map(u => u.id === id ? { ...u, status:u.status==='active'?'suspended':'active' } : u)); addAudit('TOGGLE_USER', id); },
      sendBroadcast: (title, message) => { setNotifications(p => [{ id:'n'+Date.now(), title, message, type:'announcement', read:false, createdAt:new Date().toISOString() }, ...p]); addAudit('BROADCAST', title); },
      updateSettings: s => { setSettings(s); addAudit('UPDATE_SETTINGS', 'Updated global settings'); },
      markRead: id => setNotifications(p => p.map(n => n.id === id ? { ...n, read:true } : n)),
      markAllRead: () => setNotifications(p => p.map(n => ({ ...n, read:true }))),
      resetApp: () => { localStorage.clear(); window.location.reload(); }
    }}>{children}</AppCtx.Provider>
  );
};

  const activePartners = partners.filter(p => p.status === 'active').sort((a,b) => a.displayOrder - b.displayOrder);

  useEffect(() => {
    if (activeBanners.length <= 1) return;
    const t = setInterval(() => setBIdx(p => (p + 1) % activeBanners.length), 4500);
    return () => clearInterval(t);
  }, [activeBanners.length]);

  const filtered = offers.filter(o => {
    if (o.status !== 'active') return false;

  };

  const sec = settings.enabledSections || {};
  return (
    <div className="space-y-5 pb-24 px-3 sm:px-4 pt-3 max-w-7xl mx-auto">
      {settings.announcementBanner && (
        <div className="rounded-xl bg-gradient-to-r from-[#FFC928]/20 via-[#D99B16]/20 to-[#FFC928]/10 border border-[#FFC928]/30 px-3.5 py-2.5 flex items-center justify-between text-xs">
          <div className="flex items-center gap-2 min-w-0"><span className="h-2 w-2 rounded-full bg-[#FFC928] shrink-0 animate-ping"/><span className="truncate font-medium text-zinc-200">{settings.announcementBanner}</span></div>
          <button onClick={() => setActiveTab('offers')} className="text-[10px] font-bold text-[#FFC928] ml-2 uppercase shrink-0">Explore</button>
        </div>

const WalletTab = () => {
  const { currentUser, withdrawals, settings, requestWithdrawal } = useApp();

          </div>

          <div className="p-6 rounded-2xl bg-[#15171D] border border-white/[0.08] max-w-xl space-y-3">
            <h2 className="font-display font-bold text-lg text-white">Broadcast Announcement</h2>
            {bsent && <div className="p-3 rounded-xl bg-emerald-500/20 text-emerald-400 text-xs">Sent to all users!</div>}

              <input value={om.title} onChange={e=>setOm({...om,title:e.target.value})} placeholder="Title" required className={inp}/>
              <div className="grid grid-cols-2 gap-2"><select value={om.partnerId} onChange={e=>setOm({...om,partnerId:e.target.value})} className={inp}>{partners.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select><select value={om.category} onChange={e=>setOm({...om,category:e.target.value})} className={inp}>{['Electronics','Fashion','Shoes','Beauty','Home','Accessories'].map(c=><option key={c}>{c}</option>)}</select></div>
              <div className="grid grid-cols-3 gap-2"><input type="number" value={om.originalPrice} onChange={e=>setOm({...om,originalPrice:+e.target.value})} placeholder="MRP" className={inp}/><input type="number" value={om.discountedPrice} onChange={e=>setOm({...om,discountedPrice:+e.target.value})} placeholder="Deal" className={inp}/><input value={om.commissionRate} onChange={e=>setOm({...om,commissionRate:e.target.value})} placeholder="Comm" className={inp}/></div>
              <input type="url" value={om.affiliateUrl} onChange={e=>setOm({...om,affiliateUrl:e.target.value})} placeholder="Affiliate URL" required className={inp}/>
              <input type="url" value={om.imageUrl} onChange={e=>setOm({...om,imageUrl:e.target.value})} placeholder="Image URL" required className={inp}/>
              <button type="submit" className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold">Publish Offer</button>
            </form>
          </div>
        </div>
      )}

      {bm && (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
          <div className="w-full max-w-md rounded-3xl bg-[#15171D] border border-white/10 p-6 space-y-3">
            <div className="flex justify-between items-center"><h3 className="font-bold text-white">{bm.id?'Edit Banner':'Add Banner'}</h3><button onClick={()=>setBm(null)}><Icons.X className="w-4 h-4 text-zinc-400"/></button></div>
            <form onSubmit={saveB} className="space-y-2.5 text-xs">
              <input value={bm.title} onChange={e=>setBm({...bm,title:e.target.value})} placeholder="Banner Title" required className={inp}/>
              <input value={bm.subtitle} onChange={e=>setBm({...bm,subtitle:e.target.value})} placeholder="Subtitle" required className={inp}/>
              <input type="url" value={bm.imageUrl} onChange={e=>setBm({...bm,imageUrl:e.target.value})} placeholder="Image URL" required className={inp}/>
              <input value={bm.destinationUrl} onChange={e=>setBm({...bm,destinationUrl:e.target.value})} placeholder="Target URL" required className={inp}/>
              <button type="submit" className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold">Save Banner</button>
            </form>
          </div>
        </div>
      )}

      {cm && (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
          <div className="w-full max-w-md rounded-3xl bg-[#15171D] border border-white/10 p-6 space-y-3">
            <div className="flex justify-between items-center"><h3 className="font-bold text-white">Credit Commission</h3><button onClick={()=>setCm(false)}><Icons.X className="w-4 h-4 text-zinc-400"/></button></div>
            <form onSubmit={e=>{e.preventDefault();addCommission(cf.userId,cf.partnerId,+cf.amount,cf.reason);setCm(false);}} className="space-y-2.5 text-xs">
              <select value={cf.userId} onChange={e=>setCf({...cf,userId:e.target.value})} className={inp}>{users.map(u=><option key={u.id} value={u.id}>{u.name} ({u.email})</option>)}</select>
              <select value={cf.partnerId} onChange={e=>setCf({...cf,partnerId:e.target.value})} className={inp}>{partners.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
              <input type="number" value={cf.amount} onChange={e=>setCf({...cf,amount:+e.target.value})} placeholder="Amount (₹)" required className={inp}/>
              <input value={cf.reason} onChange={e=>setCf({...cf,reason:e.target.value})} placeholder="Reason" required className={inp}/>
              <button type="submit" className="w-full py-2.5 rounded-xl bg-[#FFC928] text-[#08090C] font-bold">Credit User Wallet</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
};

const AppContent = () => {
  const { activeTab, isAdmin } = useApp();
  const [splash, setSplash] = useState(true);
  useEffect(() => { const t = setTimeout(() => setSplash(false), 1000); return () => clearTimeout(t); }, []);
  if (splash) return <SplashScreen/>;
  if (activeTab === 'admin' && isAdmin) return <><AdminDashboard/><CustomTabModal/></>;
  return (
    <div className="min-h-screen bg-[#08090C] text-[#F3F4F6] flex flex-col">
      <Header/>
      <main className="flex-1 w-full">
        {activeTab==='home' && <HomeTab/>}
        {activeTab==='earnings' && <EarningsTab/>}
        {activeTab==='offers' && <OffersTab/>}
        {activeTab==='partners' && <PartnersTab/>}
        {activeTab==='wallet' && <WalletTab/>}
        {activeTab==='notifications' && <NotificationsTab/>}
        {activeTab==='profile' && <ProfileTab/>}
        {activeTab==='more' && <MoreTab/>}
      </main>
      <BottomNav/><CustomTabModal/><AdminLoginModal/><AuthModal/><ShareModal/><OfferDetailModal/><PartnerModal/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><AppContent/></AppProvider>);
</script>
</body>
</html>
